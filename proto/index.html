/* ================= 宿主侧 · Earnings 页 ================= */
function TrendChartSVG({data,day}){
  // data: number[30]（近30天每日净收益）；max=0 时调用方已置空态；day=当前模拟天序号（Math.floor(simT/86400)，日期轴用）
  // 示意图定位：高度收紧（H=96），不追求精确读数。坐标文字用 HTML 绝对定位叠加——SVG 内文字会随 viewBox 等比拉伸（宽屏 ~3x）
  // X 轴：5 等分（0, 7, 14, 21, 29）→ 视觉严格等距，对应每 7 天（自然周），最后一段 8 天可接受
  // Y 轴：保持 3 档（0、50%、100%），示意图不需精细读数
  const W=600,H=96,P_L=44,P_R=10,P_T=8,P_B=20;
  const max=Math.max(...data,0.01), n=data.length;
  const iw=W-P_L-P_R, ih=H-P_T-P_B;
  const px=i=>P_L+(n===1?iw/2:i*iw/(n-1));
  const py=v=>P_T+ih-(v/max)*ih;
  const pct=(x,y)=>({position:'absolute',left:`${(x/W*100).toFixed(2)}%`,top:`${(y/H*100).toFixed(2)}%`});
  const axisMono={...NUM.axis.mono, paddingRight:6, textAlign:'right', width:`${P_L/W*100}%`};
  const axisSans={...NUM.axis.sans};
  const yLabels=Array.from({length:3},(_,i)=>{ const v=max*i/2; return (
    <span key={i} style={{...pct(0,py(v)), ...axisMono, transform:"translateY(-50%)"}}>{"$"+v.toFixed(1)}</span>);});
  const fmtD=i=>new Date(((day??0)-(n-1-i))*86400*1000).toISOString().slice(5,10); // MM-DD
  // 5 等分索引：严格等距（n=30 → 1, 8, 15, 22, 29，每段恒 7 天；首刻度内缩 1 天换取末段不再多 1 天）
  const xIdx=Array.from({length:5},(_,k)=>1+Math.round(k*(n-2)/4));
  const xTicks=xIdx.map((i,k)=>(
    <span key={i} style={{...pct(px(i),H-9), ...axisSans, transform:`translate(${k===0?"0":k===xIdx.length-1?"-100%":"-50%"},-50%)`}}>{fmtD(i)}</span>));
  const grid=Array.from({length:3},(_,i)=>{ const y=py(max*i/2); return <line key={i} x1={P_L} x2={W-P_R} y1={y} y2={y} stroke="var(--color-border)" strokeWidth="1"/>;});
  const pts=data.map((v,i)=>`${px(i).toFixed(1)},${py(v).toFixed(1)}`);
  const area=`M ${P_L},${H-P_B} L ${pts.join(" L ")} L ${W-P_R},${H-P_B} Z`;
return (
    <div className="relative" style={{width:'100%',aspectRatio:`${W}/${H}`}}>
     <svg viewBox={`0 0 ${W} ${H}`} className="absolute inset-0 block w-full h-full" role="img" aria-label="earnings trend 30d">
      {grid}{/* xTicks/yLabels 已叠加为 HTML 文字 */}
      <path d={area} fill="var(--color-warning)" fillOpacity=".12"/>
      <path d={`M ${pts.join(" L ")}`} fill="none" stroke="var(--color-warning)" strokeWidth="1.8" strokeLinejoin="round" strokeLinecap="round"/>
      {data.map((v,i)=>{ const [x,y]=pts[i].split(",").map(Number); return <circle key={i} cx={x} cy={y} r={v>0?1.6:0} fill="var(--color-warning)"/>; })}
     </svg>
     {yLabels}{xTicks}
    </div>);
}

/* 统计卡片 + 趋势图（只读信息区；可提现卡内嵌提现入口） */
function EarningsStats({S,setS}){
 // 收益统计（净额口径 amt×(1−rate)，与 Admin hostNet 同源；seed legacy 两笔均落在 30 天窗口内）
 const _m30=S.simT-30*86400;
 const hostRows=(S.ledger||[]).filter(e=>e.hostEarn&&e.amt>0);
 const monthNet=hostRows.filter(e=>e.t>=_m30).reduce((a,e)=>a+e.amt*(1-(e.rate||0)),0);
 const totalGross=hostRows.reduce((a,e)=>a+e.amt,0);
 const totalNet=hostRows.reduce((a,e)=>a+e.amt*(1-(e.rate||0)),0);
  const platFee=totalGross-totalNet;
  // 违约风险卡数据源：违约事件行（evBreach，引擎 §7.12 写入；事件行无 hostEarn 标记故收益明细不显示，此处单独取）
  const breachRows=(S.ledger||[]).filter(e=>e.msgKey==="evBreach");
  // 提现入口状态（合并提现页后由行动卡承载）：在审申请禁再次发起；< $20 常显禁用+提示（防按钮凭空消失）
  const pendingWd=(S.payoutReqs||[]).find(q=>q.email===S.user?.email&&q.status==="pending");
  const canWithdraw=S.hostEarnings>=20;
 // 趋势图：近30天按天聚合（净额口径）；依赖按天取整的 simT，避免逐 tick 重算
 const _day=Math.floor(S.simT/86400);
 const trend=useMemo(()=>{
   const days=[];
   for(let i=29;i>=0;i--){
     const s=_day*86400-(i+1)*86400, e=_day*86400-i*86400;
     const sum=S.ledger.filter(x=>x.hostEarn&&x.t>=s&&x.t<e&&x.amt>0).reduce((a,x)=>a+x.amt*(1-(x.rate||0)),0);
     days.push(+sum.toFixed(4));
   }
   return days;
 },[S.ledger,_day]);
 const trendTotal=trend.reduce((a,v)=>a+v,0);
return (<>
   {/* 统计卡片 ×4 */}
   <div className="grid gap-3 sm:grid-cols-2 lg:grid-cols-4">
    <section className="rounded-xl border border-[var(--color-warning)]/30 bg-[var(--color-warning)]/[.05] p-4">
     <div className={NUM.label}>{T.eaWithdrawable}</div>
     <div className={NUM.displayMoney + " mt-1"}>${S.hostEarnings.toFixed(2)}</div>
     <div className="mt-1 flex flex-wrap items-center justify-between gap-x-2 gap-y-1">
      <span className={NUM.caption}>{T.eaWithdrawableSub}</span>
      <button disabled={!canWithdraw||!!pendingWd} onClick={()=>setS(p=>({...p,modal:"withdraw"}))}
       title={pendingWd?T.wdPendingT:(!canWithdraw?T.eaWdThreshold:"")}
       className={`shrink-0 rounded-md px-2.5 py-1 text-[12px] font-bold ${canWithdraw&&!pendingWd?"bg-[var(--color-accent)] text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]":"cursor-not-allowed bg-[var(--color-surface)] text-[var(--color-text-faint)]"}`}>
       {pendingWd?T.wdPendingBtn:T.eaWdTitle}</button>
     </div>
     {pendingWd && <div className="mt-2 text-[12px] leading-snug text-[var(--color-text-muted)]">{T.wdPendingT} · <span className="mono text-[var(--color-warning)]">${(+pendingWd.amt||0).toFixed(2)}</span></div>}
     {!canWithdraw && <div className="mt-2 text-[12px] leading-snug text-[var(--color-warning)]/70">{T.eaWdWarn}</div>}
    </section>
    <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
     <div className={NUM.label}>{T.eaMonthly}</div>
     <div className={NUM.titleMoney + " mt-1"}>{fmt$(monthNet,2)}</div>
     <div className={NUM.caption + " mt-1"}>{T.eaMonthlySub}</div>
    </section>
    <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
     <div className={NUM.label}>{T.eaTotalGross}</div>
     <div className={NUM.titleMoney + " mt-1"}>{fmt$(totalGross,2)}</div>
     <div className={NUM.caption + " mt-1"}>{T.eaTotalNet} {fmt$(totalNet,2)}{platFee>0.004?` · ${T.eaPlatFee} −${fmt$(platFee,2)}`:""}</div>
    </section>
    {/* 违约风险卡：宿主真实风险信号（断连→下架），替换原平台抽成卡（抽成为可推导量且默认 0%） */}
    <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
     <div className={NUM.label}>{T.eaRiskTitle}</div>
     {breachRows.length? (
      <div className="mt-1 space-y-1.5">
       {breachRows.slice(0,2).map((e,i)=>(
        <div key={e.txnId||i} className="flex items-baseline justify-between gap-2">
         <span className="text-[13px] text-[var(--color-text-secondary)] truncate">{e.id||"—"}</span>
         <span className="text-[12px] text-[var(--color-text-faint)]">{fmtStamp(e.t)}</span>
        </div>))}
       {breachRows.length>2 && <div className={NUM.caption}>+{breachRows.length-2} more</div>}
      </div>
     ):(
      <div className={NUM.caption + " mt-1.5"}>{T.eaRiskNone}</div>
     )}
    </section>
   </div>
   {/* 收益趋势 */}
   <section className="mt-4 rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
    <div className="mb-3 flex flex-wrap items-baseline justify-between gap-x-2 gap-y-0.5">
     <h3 className={NUM.sectionTitle}>{T.eaTrendTitle}</h3>
     <span className={NUM.caption}>{T.eaTrendUnit}</span>
    </div>
     {trendTotal>0? <TrendChartSVG data={trend} day={_day}/> : <p className="py-8 text-center" style={{...NUM.axis.sans, fontSize:13}}>{T.eaTrendEmpty}</p>}
   </section>
  </>);
}

/* ================= Payout 绑定弹窗（2026-09-18 多通道） ================= */
function BindPayoutModal({S,act,setS}){
 const CHANNELS=PAYOUT_CHANNELS;
 const RATES=PAYOUT_RATES;
 const _bound=(S.payouts||[]).map(x=>x.channel);
 const [ch,setCh]=useState(()=>{ // 默认选中：未绑定通道优先，否则回退首通；payoutDraft 已弃用（页面统一走本弹窗）
   const init=S.payoutDraft&&CHANNELS.some(([n])=>n===S.payoutDraft)?S.payoutDraft:null;
   return init||CHANNELS.find(([n])=>!_bound.includes(n))?.[0]||"Wise";
 });
 const boundEmail=(S.payouts||[]).find(x=>x.channel===ch)?.email||"";
 const [email,setEmail]=useState(boundEmail||"finance@sea-replica.demo");
 const ok=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
 // 切换通道时回填已绑定邮箱（避免渲染期 setState）
 useEffect(()=>{ if(boundEmail) setEmail(boundEmail); },[ch]); // eslint-disable-line react-hooks/exhaustive-deps
  return (
 <ModalShell width="max-w-sm" onClose={()=>setS(p=>({...p,modal:null}))}>
    <div className="border-b border-[var(--color-border)] px-5 py-3"><h2 className="text-[16px] font-semibold">{T.poTitle(ch)}</h2></div>
   <div className="space-y-3 p-5">
    <div>
     <div className="mb-1 text-[13px] text-[var(--color-text-muted)]">{T.eaWdChannel}</div>
     <div className="grid grid-cols-3 gap-2">
      {CHANNELS.map(([n,r])=>(
       <button key={n} onClick={()=>setCh(n)}
        className={`rounded-xl border p-2.5 text-left transition-colors ${ch===n?"border-[var(--color-accent)] bg-[var(--color-accent)]/10 ring-1 ring-sky-500/40":"border-[var(--color-border)] hover:border-[var(--color-border-strong)]"}`}>
        <div className={`text-[13px] font-medium ${ch===n?"text-[var(--color-accent-hover)]":"text-[var(--color-text-secondary)]"}`}>{n.split(" ")[0]}</div>
        <div className="mono mt-0.5 text-[12px] font-semibold text-[var(--color-success)]">{r}</div>
        {_bound.includes(n) && <div className="mt-0.5 text-[10px] font-medium text-[var(--color-text-muted)]">✓ {T.poBound}</div>}
       </button>))}
     </div>
     {_bound.includes(ch) && <p className="mt-1.5 text-[11px] text-[var(--color-text-muted)]">{T.poBoundHint}{" "}{T.eaActive(ch,boundEmail||"—")}</p>}
    </div>
    <label className="block text-[13px] text-[var(--color-text-muted)]">{T.poEmail}
     <input value={email} onChange={e=>setEmail(e.target.value)} aria-label={T.poEmailAria}
      className="mono mt-1 w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2 text-[14px]"/></label>
    <p className="text-[12.5px] leading-snug text-[var(--color-text-muted)]">{T.poRateNote(RATES[ch])}</p>
   </div>
   <div className="flex justify-end gap-2 border-t border-[var(--color-border)] px-5 py-3">
    <button onClick={()=>setS(p=>({...p,modal:null}))} className="rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-[14px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)]">{T.poCancel}</button>
    <button disabled={!ok} onClick={()=>{act.bindPayout(ch,email);act.toast(T.poOk(ch));}}
     className={`rounded-lg px-4 py-1.5 text-[14px] font-semibold ${ok?"bg-[var(--color-accent)] text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]":"cursor-not-allowed bg-[var(--color-surface)] text-[var(--color-text-faint)]"}`}>{T.poConfirm}</button>
   </div>
  </ModalShell>);
}


/* ================= mount ================= */
class ErrorBoundary extends React.Component {
 constructor(props){ super(props); this.state={hasError:false,msg:""}; }
 static getDerivedStateFromError(e){ return {hasError:true,msg:e&&e.message?e.message:String(e)}; }
 componentDidCatch(e,i){ try{console.error("[ErrorBoundary]",e,i)}catch(_){} }
 render(){
  if(this.state.hasError){
   return (
    <div className="flex min-h-screen items-center justify-center p-6">
     <div className="max-w-md rounded-2xl border border-[var(--color-error)]/40 bg-[var(--color-surface)] p-6 text-center shadow-xl">
      <div className="mb-2 text-[18px] font-semibold text-[var(--color-text)]">出了点问题 · Something went wrong</div>
      <p className="mono mb-4 text-[13px] break-words text-[var(--color-text-muted)]">{this.state.msg}</p>
      <button onClick={()=>{try{localStorage.removeItem("gpu-market-demo-v1");localStorage.removeItem(ACCOUNTS_KEY);}catch(_){}; location.reload();}}
       className="rounded-lg bg-[var(--color-accent)] px-4 py-2 text-[14px] font-semibold text-[var(--color-text)]">重置并重新加载</button>
     </div>
    </div>);
  }
  return this.props.children;
 }
}

function Root(){
 const app = React.createElement(App);
 // 用 wrapper 让 ConfirmPageInline 能读到 modal 状态（App 内部渲染其余弹窗，confirm 单独提升在此会破坏状态封闭，改为在 App 内直接条件渲染）
 return <ErrorBoundary>{app}</ErrorBoundary>;
}
// 在 App 渲染树中补挂 confirm：
const _origAppRender = null;
ReactDOM.createRoot(document.getElementById("root")).render(<ErrorBoundary><AppWithConfirm/></ErrorBoundary>);
function AppWithConfirm(){
 // 直接复用 App 并叠加 confirm 层：通过把 ConfirmPageInline 嵌入 App 的方式更干净，
 // 但为了保持单遍渲染，这里用 context-free 方案：App 内部已处理 modal==="confirm"？见下方 patch。
 return <App/>;
}
</script>
<script>
/* 补丁：在 App 渲染结果上追加 confirm 层（避免重写 App 主体）——通过 MutationObserver 不必要，
   直接采用方案 B：上面 TemplateModal/CreditsModal 关闭后由 openRent 设 modal=confirm，
   由 App 内 InstancesPage/SearchPage 之外的固定位置渲染。此处 hook render。 */
 document.addEventListener("DOMContentLoaded",()=>{
  try{const t=localStorage.getItem("gpu-market-theme");document.documentElement.classList.toggle("dark",t!=="light")}catch(e){}
 });
</script>
