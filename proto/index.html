    // 宿主违约结算（§7.12 · 2026-09-18）：断连超 5min → 退房全额退余款（租户无责）+ 违约事件流水 + 宿主机自动下架（仅宿主机反解）+ 清该机他人预订
    if(n.instances.some(x=>x.__breach)){
     n.instances.filter(x=>x.__breach).forEach(it=>{
      const _ref=+(it.escrowHold||0).toFixed(4); // escrowHold=未摊销余款（已摊销部分已入宿主收益=已赚保留）
      if(_ref>0.0001){ n.balance=+(n.balance+_ref).toFixed(4); flush.push({t:n.simT,msgKey:"lgRefund",sid:it.shortId,gpu:it.offer?.gpu,amt:_ref,txnId:txid(),balAfter:n.balance}); }
      flush.push({t:n.simT,msgKey:"evBreach",id:it.shortId,amt:null});
      const _oid=String(it.offer?.id||"");
      if(_oid.startsWith("host-")){ const _mid=_oid.slice(5);
       n.hostMachines=n.hostMachines.map(m=>m.id===_mid&&m.status!=="removed"?{...m,status:"removed"}:m); // removed 终态（幂等：多实例同时超时不重复转换）
       n.bookings=(n.bookings||[]).filter(b=>b.offerId!==_oid); // 清该机他人预订残留
      }
     });
     n.instances=n.instances.filter(x=>!x.__breach);
    }
    if(flush.length){ n.ledger=trimLedger([...flush.reverse(), ...n.ledger]); }
    // 余额耗尽分支（L3-3 无绑卡路径）——仅按量 SKU：时段订单为封闭预付不触发（§7.1），Reserved 预付冻结同理
    if(n.balance<=0 && n.instances.some(i=>(i.contractType||"ondemand")==="ondemand" && ["Running","Loading","Connecting","Scheduling"].includes(i.status)) && !n.debtBanner){
     n.debtBanner=true;
     n.instances.forEach(it=>{ if((it.contractType||"ondemand")==="ondemand" && ["Running","Loading","Connecting","Scheduling"].includes(it.status)){ it.status="Inactive"; it.debtStopped=true; } });
      n.ledger=trimLedger([{t:n.simT,msgKey:"evDebt",amt:null},...n.ledger]);
     // 托管释放：自动停机 → 预留归还可退款余额（只动按量的全局 escrow，订单 escrowHold 分立不可误释放）
     const released=n.instances.filter(i=>i.debtStopped && (i.contractType||"ondemand")==="ondemand" && i.offer?.dph).reduce((a,i)=>a+i.offer.dph,0);
     if(released>0){ n.escrow=Math.max(0,+(n.escrow-released).toFixed(3)); }
    }
    return n;
   });
  },250);
  return ()=>clearInterval(iv);
 },[]);

  /* ---- Admin 演示联动（2026-09-14）：admin.html 干预的接收端 ----

  const [adminCfg,setAdminCfg] = useState(loadAdminCfg());

   setAdminCfg(c);

    if(_fs.size){ setS(p=>{ let changed=false, esc=p.escrow;

     return changed? {...p,instances:inst,escrow:esc} : p; }); } // 订单/预订实例不走按量强停路径（全局 escrow 不可误动，§7.9 P0-2 混账防线）；Admin 强退走 forceDestroy=platform 分叉
   // 出金审批（2026-09-15）：cfg.payouts 快照按 id 匹配本端申请——approved 即扣 hostEarnings（幂等：paid/status 标记持久化，重复广播不重复扣）；rejected 仅置态，钱不动。
   // toast 基于预判（ref.current）：React 批处理下 updater 不可同步读新态；payoutReqs 仅 withdraw/本函数写，无并发竞态。
   const po=c.payouts||{};
   const _ok=new Map((po.approved||[]).map(x=>[x.id,x])); const _rj=new Set((po.rejected||[]).map(x=>x.id));
   if(_ok.size||_rj.size){
     const toPaid=[],toRej=[];
     (ref.current.payoutReqs||[]).forEach(q=>{ if(q.status!=="pending") return;
       if(_ok.has(q.id)&&!q.paid) toPaid.push(q); else if(_rj.has(q.id)&&!q.rejNoted) toRej.push(q); });
     if(toPaid.length||toRej.length){
       setS(p=>{ let changed=false; let he=p.hostEarnings;
         const reqs=(p.payoutReqs||[]).map(q=>{
           if(q.status!=="pending") return q;
           if(_ok.has(q.id)&&!q.paid){ changed=true; he=+(he-(q.amt||20)).toFixed(2); return {...q,status:"approved",paid:true}; }

           return q; });
         return changed? {...p,payoutReqs:reqs,hostEarnings:he} : p; });
       toPaid.forEach(q=>act.toast(T.wdPaid(q.amt||20)));
       toRej.forEach(q=>act.toast(T.wdRejected(q.amt||20)));
     }
   }

     if(sku!=="ondemand" && st.balance<orderTotal){ act.toast(T.cfBalShort(orderTotal.toFixed(2))); return; } // 二次校验（P1-5）
      const it={ key:rid("k"), id:r(10000000,99999999), shortId:"i-"+r(100000,999999),
       hostId:r(100000,999999), machineId:r(10000,99999), offer, offerId:offer.id, ip, // offerId：时段互斥占用源关联（v3.3；老实例无此字段不参与冲突）
      dph:offer.dph, contractType:sku,
      ...(sku!=="ondemand"?{ orderTotal, amortized:0, durationSec:cfg.durationSec, escrowHold:orderTotal }:{}),
      template:st.selectedTemplate.name, imageTag:cfg.imageTag, launchMode:cfg.launchMode,
      diskAlloc:cfg.diskGb, env:cfg.env, onstart:cfg.onstart||"", hostname:cfg.hostname, customPorts:cfg.customPorts,
      ...(sku==="reserved"
        ?{ status:"Reserved", startAt:cfg.startAt, phaseUntil:cfg.startAt, createdAt:S_sim(), rentalEnd:cfg.startAt+cfg.durationSec } // 预订：到点自动开（§7.7），rentalEnd=startAt+档
        :{ status:"Creating", phaseUntil:S_sim()+70, createdAt:S_sim(), rentalEnd:S_sim()+(cfg.durationSec||86400) }),
      acc:0, extPort22:r(30000,62000), extPort8080:r(30000,62000), stuck:false };
    setS(p=>({...p,instances:[it,...p.instances],modal:null,view:"instances",pendingOffer:null,
      // 订单/预订下单全额划款即记 lgOrderPay 流水（P0.6 对账闭环）；按量仅预留全局 escrow（不动 balance，故无流水）
      ...(sku==="ondemand"?{ escrow:+(p.escrow+offer.dph).toFixed(3) }
        :{ balance:+(p.balance-orderTotal).toFixed(4), ledger:trimLedger([{t:p.simT,msgKey:"lgOrderPay",sid:it.shortId,gpu:offer.gpu,amt:orderTotal,txnId:txid(),balAfter:+(p.balance-orderTotal).toFixed(4)},...p.ledger]) })}));
   if(sku==="order") act.toast(T.tOrderCreated(orderTotal.toFixed(2)));
   if(sku==="reserved") act.toast(T.tReserveCreated(orderTotal.toFixed(2)));
  },
    stopInst:(key)=>{
     const _it=ref.current.instances.find(x=>x.key===key);
     if(_it && (_it.contractType||"ondemand")!=="ondemand") return; // 订单无 Stop（物理卡期规则 §7.3），防御 no-op；UI 层订单卡不渲染 Stop
     setS(p=>({...p,instances:p.instances.map(x=>x.key===key?{...x,status:"Inactive",debtStopped:false,stuck:false,stuckHint:false}:x),escrow:Math.max(0,+(p.escrow-(p.instances.find(x=>x.key===key)?.offer?.dph||0)).toFixed(3))}));
    },
   restartInst:(key)=>setS(p=>({...p,instances:p.instances.map(x=>{
     if(x.key!==key)return x;
     const stuck = p.armStuck && Math.random()<0.75;
     return {...x,status:"Scheduling",stuck,stuckHint:false,resolveAt:p.simT+90,hintAt:p.simT+1800};
    }),armStuck:false})),
   rebootInst:(key)=>setS(p=>({...p,instances:p.instances.map(x=>{
     if(x.key!==key)return x;
     return {...x,status:"Rebooting",phaseUntil:p.simT+30};
    })})),
   destroyInst:(key,reason="user")=>{ // reason：user=租户主动（订单=提前退房，未摊销×15% 罚金）；platform=Admin 强停（=平台强退语义，全额退免罚金 §7.4，toast 由 Admin 事件方负责）
     const st=ref.current; const it=st.instances.find(x=>x.key===key); if(!it) return;
     const ct=it.contractType||"ondemand";
     if(ct==="ondemand"){ // 按量：现状路径（全局 escrow 释放）
       setS(p=>({...p,instances:p.instances.filter(x=>x.key!==key),escrow:Math.max(0,+(p.escrow-(it.offer?.dph||0)).toFixed(3))})); return; }
     const hold=it.escrowHold||0;
     if(ct==="reserved" && it.status==="Reserved"){ // 仅「到点前取消」全款退（§7.7）；已开机的预定单退房走订单罚金逻辑（§7.4）
       setS(p=>{ const nb=+(p.balance+hold).toFixed(4); return {...p,instances:p.instances.filter(x=>x.key!==key),balance:nb,ledger:trimLedger([{t:p.simT,msgKey:"lgRefund",sid:it.shortId,gpu:it.offer?.gpu,amt:hold,txnId:txid(),balAfter:nb},...p.ledger])}; });
       act.toast(T.tReserveCancel(hold.toFixed(2))); return; }
     // 订单退房（§7.4）：escrowHold 余款=未摊销；罚金只按原因驱动，不按入口驱动
     const refund = reason==="platform"? hold : +(hold*0.85).toFixed(4);
     const penalty = +(hold-refund).toFixed(4);
     const evs=[{t:st.simT,msgKey:"lgRefund",sid:it.shortId,gpu:it.offer?.gpu,amt:refund,txnId:txid()}];
     if(penalty>0.0001) evs.push({t:st.simT,msgKey:"lgPenalty",sid:it.shortId,gpu:it.offer?.gpu,amt:penalty,txnId:txid()});
     setS(p=>{ const nb=+(p.balance+refund).toFixed(4); return {...p,instances:p.instances.filter(x=>x.key!==key),balance:nb,ledger:trimLedger([...evs.map(e=>({...e,balAfter:nb})),...p.ledger])}; });
     if(reason!=="platform") act.toast(T.tEarlyReturn(penalty.toFixed(2),refund.toFixed(2)));
   },
 };
 function S_sim(){ return ref.current.simT; }

const filtered = useMemo(()=>{
 // 市场供给 = 静态 vast 采样 offer（平台实测已验证）+ 首发池自购/签约 + 宿主上架（P2P 撮合闭环，source 标注）
    const all = allSupply(S.hostMachines).filter(o=>!(adminCfg.delisted||[]).includes(String(o.id))); // Admin 联动：强制下架过滤
    let list = all.filter(o=>{

     if(!S.filters.gpus.length && S.filters.searchModel) {

     if(o.reliability!=null && o.reliability < S.filters.relMin) return false;
     if(S.filters.priceMax && o.dph > +S.filters.priceMax) return false;
     if(S.filters.priceMin && o.dph < +S.filters.priceMin) return false;
     if(S.filters.priceMax && S.filters.priceMin && +S.filters.priceMin>+S.filters.priceMax) return false; // 交叉非法→豁免全部
     if(o.numGpu!=null && o.numGpu < S.filters.numGpuMin) return false;
     if(S.filters.gpuRamMin && o.gpuRam!=null && o.gpuRam < S.filters.gpuRamMin) return false;
     if(o.disk!=null && o.disk < S.filters.diskMin) return false;
     if(S.filters.cpuMin && o.cpuCores!=null && o.cpuCores < S.filters.cpuMin) return false;
     if(S.filters.ramMin && o.ram!=null && o.ram < S.filters.ramMin) return false;
     if(S.filters.netDownMin && o.netDown!=null && o.netDown < S.filters.netDownMin) return false;
     if(S.filters.netUpMin && o.netUp!=null && o.netUp < S.filters.netUpMin) return false;
     // 模板过滤（任务导向显式入口）：端口是硬约束（物理不可扩容）；磁盘满足确认页可额外申请语义（vast），不参与过滤、仅黄警软提示
     if(S.filters.tpl){ const _t=TEMPLATES.find(x=>x.id===S.filters.tpl);
      if(_t){ const c=tplCompat(o,_t); if(c.portShort) return false; } }
     return true;
    });
   const s=S.sort;
   list.sort((a,b)=> s==="priceAsc"? a.dph-b.dph : s==="dlperf"?( (b.dlperf||0)-(a.dlperf||0) ) : (b.reliability||0)-(a.reliability||0));
   return list;
  },[S.filters,S.sort,S.hostMachines,adminCfg]);

 /* ================= 渲染 ================= */

function SearchPage({S,act,setS,filtered}){
 return (
<main className="mx-auto flex max-w-[1400px] flex-col gap-5 px-5 pt-4 lg:flex-row">
    {/* 筛选栏 */}
    <aside className="w-full shrink-0 lg:w-[252px]">
     <div className="space-y-3 lg:sticky lg:top-[64px]">
     {/* 一键重置 */}
     <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-3">
      <div className="flex items-center justify-between gap-2">
       <h3 className="text-[13px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">Filters</h3>
       <button onClick={()=>act.resetFilters()} aria-label={T.fResetAria}
        className="rounded-md border border-[var(--color-border)] px-2 py-0.5 text-[12.5px] text-[var(--color-text-muted)] transition-colors hover:border-[var(--color-border-strong)] hover:text-[var(--color-text)]">
        ↺ {T.fReset}</button>
      </div>
     </section>
     {/* 模板组（第一个筛选条件） */}
     <FGroup T={T} open={true} title={T.tplFilter} count={S.filters.tpl?1:0} isTemplate={true}>
      <select value={S.filters.tpl||""} onChange={e=>{
       const tplId = e.target.value || null;
       const tpl = tplId ? TEMPLATES.find(t=>t.id===tplId) : null;
       const inj = tpl ? {diskMin:tpl.inject.diskMin, portsMin:tpl.portsMin} : null;
       setS(p=>({...p, filters:{...p.filters, tpl:tplId}, injectedParams:inj}));
      }} aria-label={T.tplFilter}
       className="w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] text-[var(--color-text-secondary)]">
       <option value="">{T.tplFilterNone}</option>
       {TEMPLATES.map(t=><option key={t.id} value={t.id}>{t.name}</option>)}
      </select>
     </FGroup>
     {/* 型号搜索 */}
     <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-3">
      <h3 className="mb-2 text-[13px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">{T.fSearchModel}</h3>
      <input type="search" role="searchbox" aria-label={T.fSearchModelAria}
       disabled={S.filters.gpus.length>0}
       placeholder={S.filters.gpus.length>0 ? T.fSportSearch : T.fSearchModelPh}
       value={S.filters.gpus.length>0 ? "" : S.filters.searchModel}
       onChange={e=>act.setFilter("searchModel",e.target.value)}
       className={`mono w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[14px] ${S.filters.gpus.length>0?"opacity-50 cursor-not-allowed":""}`}/>
      {S.filters.gpus.length>0 && <p className="mt-1 text-[12px] text-[var(--color-text-faint)]">{T.fSportSearch}</p>}
     </section>
     {/* GPU 组（默认展开） */}
     <FGroup T={T} open={true} title={T.fgGpu} count={S.filters.gpus.length||(S.filters.numGpuMin>1?1:0)+(S.filters.gpuRamMin>0?1:0)}>
      <div>
       <h3 className="mb-2 text-[13px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">{T.fGpuModel}</h3>
       <div className="space-y-1.5">
        {GPU_LIST.map(g=>(
         <label key={g} className="flex cursor-pointer items-center gap-2 text-[14px] text-[var(--color-text-secondary)]">
          <input type="checkbox" checked={S.filters.gpus.includes(g)} onChange={()=>act.toggleGpu(g)} className="accent-blue-500" aria-label={T.fFilterAria+" "+g}/>
          <span className="truncate">{g}</span>
         </label>))}
       </div>
      </div>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fNumGpu}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.numGpuMin}</span></div>
       <input type="range" min="1" max="8" step="1" value={S.filters.numGpuMin} onChange={e=>act.setFilter("numGpuMin",+e.target.value)} className="w-full" aria-label={T.fNumGpuAria}/>
      </div>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fGpuRam}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.gpuRamMin>0 ? S.filters.gpuRamMin+" GB" : T.fUnltd}</span></div>
       <input type="range" min="0" max="96" step="4" value={S.filters.gpuRamMin} onChange={e=>act.setFilter("gpuRamMin",+e.target.value)} className="w-full" aria-label={T.fGpuRamAria}/>
      </div>
     </FGroup>
     {/* 性能组（CPU / 内存） */}
     <FGroup T={T} title={T.fgPerf} count={(S.filters.cpuMin?1:0)+(S.filters.ramMin?1:0)}>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fCpuMin}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.cpuMin?S.filters.cpuMin+" "+T.fCpuUnit:T.fUnltd}</span></div>
       <input type="range" min="0" max="384" step="16" value={S.filters.cpuMin} onChange={e=>act.setFilter("cpuMin",+e.target.value)} className="w-full" aria-label={T.fCpuMinAria}/>
      </div>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fRamMin}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.ramMin?S.filters.ramMin+" "+T.fRamUnit:T.fUnltd}</span></div>
       <input type="range" min="0" max="256" step="16" value={S.filters.ramMin} onChange={e=>act.setFilter("ramMin",+e.target.value)} className="w-full" aria-label={T.fRamMinAria}/>
      </div>
     </FGroup>
     {/* 网络组（上/下行带宽 + 磁盘） */}
     <FGroup T={T} title={T.fgNet} count={(S.filters.netUpMin?1:0)+(S.filters.netDownMin?1:0)+(S.filters.diskMin>10?1:0)}>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fNetDown}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.netDownMin?S.filters.netDownMin+" "+T.fBwUnit:T.fUnltd}</span></div>
       <input type="range" min="0" max="17000" step="500" value={S.filters.netDownMin} onChange={e=>act.setFilter("netDownMin",+e.target.value)} className="w-full" aria-label={T.fNetDownAria}/>
      </div>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fNetUp}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.netUpMin?S.filters.netUpMin+" "+T.fBwUnit:T.fUnltd}</span></div>
       <input type="range" min="0" max="17000" step="500" value={S.filters.netUpMin} onChange={e=>act.setFilter("netUpMin",+e.target.value)} className="w-full" aria-label={T.fNetUpAria}/>
      </div>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]">
        <span>{T.fDiskMin}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.diskMin} GB</span>
       </div>
       <input type="range" min="10" max="256" step="2" value={S.filters.diskMin} onChange={e=>act.setFilter("diskMin",+e.target.value)} className="w-full" aria-label={T.fDiskMinAria}/>
       <p className="mt-1 text-[12.5px] leading-snug text-[var(--color-warning)]/70">{T.fDiskNote}</p>
      </div>
     </FGroup>
     {/* 规格组（PCIe） */}
     <FGroup T={T} title={T.fgSpec} count={S.filters.pcies.length}>
      <div>
       <h3 className="mb-2 text-[13px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">{T.fPcie}</h3>
       <div className="space-y-1.5">
        {[3.0,4.0,5.0].map(v=>(
         <label key={v} className="flex cursor-pointer items-center gap-2 text-[14px] text-[var(--color-text-secondary)]">
          <input type="checkbox" checked={S.filters.pcies.includes(+v)} onChange={()=>act.toggleArr("pcies",+v)} className="accent-blue-500" aria-label={T.fPcieAria+" "+v}/>
          <span>PCIe {v}</span>
         </label>))}
       </div>
      </div>
     </FGroup>
     {/* 位置与验证组 */}
     <FGroup T={T} title={T.fgLoc} count={S.filters.locs.length+(S.filters.includeUn?1:0)+(S.filters.hideOwn?1:0)}>
      <div>
       <h3 className="mb-2 text-[13px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">{T.fLocLabel}</h3>
       <div className="space-y-1.5">
        {locOptions(S).map(l=>(
         <label key={l} className="flex cursor-pointer items-center gap-2 text-[14px] text-[var(--color-text-secondary)]">
          <input type="checkbox" checked={S.filters.locs.includes(l)} onChange={()=>act.toggleArr("locs",l)} className="accent-blue-500" aria-label={T.fLocAria+" "+l}/>
          <span>{l==="Host"?T.fLocHost:countryName(S,l)}</span>
         </label>))}
       </div>
      </div>
      <label className="flex cursor-pointer items-center gap-2 text-[14px] text-[var(--color-text-secondary)]">
       <input type="checkbox" checked={S.filters.includeUn} onChange={e=>act.setFilter("includeUn",e.target.checked)} className="accent-blue-500" aria-label={T.fIncUnAria}/>
       {T.fIncludeUn}
      </label>
      <label className="flex cursor-pointer items-center gap-2 text-[14px] text-[var(--color-text-secondary)]">
       <input type="checkbox" checked={S.filters.hideOwn} onChange={e=>act.setFilter("hideOwn",e.target.checked)} className="accent-blue-500" aria-label={T.fHideOwn}/>
       {T.fHideOwn}
      </label>
      <p className="-mt-2 text-[12px] leading-snug text-[var(--color-text-muted)]">{T.fUnvNote}</p>
     </FGroup>
     {/* 价格与可靠性组 */}
     <FGroup T={T} title={T.fgPrice} count={(S.filters.priceMin!==""||S.filters.priceMax!==""?1:0)+(S.filters.relMin>0?1:0)}>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fPriceLabel}</span></div>
       <div className="grid grid-cols-2 gap-1.5">
        <div className="min-w-0">
         <input type="number" min="0" step="0.1" placeholder="下限" aria-label={T.fPriceMinAria} value={S.filters.priceMin} onChange={e=>act.setFilter("priceMin",e.target.value)}
          className="mono w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[14px]"/>
        </div>
        <div className="min-w-0">
         <input type="number" min="0" step="0.1" placeholder="上限" aria-label={T.fPriceMaxAria} value={S.filters.priceMax} onChange={e=>act.setFilter("priceMax",e.target.value)}
          className="mono w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[14px]"/>
        </div>
       </div>
       {(S.filters.priceMin!==""&&(isNaN(+S.filters.priceMin)||+S.filters.priceMin<0)) ||
        (S.filters.priceMax!==""&&(isNaN(+S.filters.priceMax)||+S.filters.priceMax<0)) ? (
        <p className="mt-1 text-[12.5px] text-red-400">{T.fPriceErr}</p>) : null}
       {(S.filters.priceMin!==""&&S.filters.priceMax!==""&&+S.filters.priceMin>+S.filters.priceMax) && (
        <p className="mt-1 text-[12.5px] text-amber-400/90">{T.fPriceRangeErr}</p>)}
      </div>
      <div>
       <div className="mb-1 flex justify-between text-[13px] text-[var(--color-text-muted)]"><span>{T.fRelMin}</span><span className="mono text-[var(--color-text-secondary)]">{S.filters.relMin}%</span></div>
       <input type="range" min="0" max="100" value={S.filters.relMin} onChange={e=>act.setFilter("relMin",+e.target.value)} className="w-full" aria-label={T.fRelMinAria}/>
      </div>
     </FGroup>
   </div>
  </aside>
  {/* 结果区 */}
  <section className="min-w-0 flex-1">
   <div className="mb-2 flex flex-wrap items-center gap-x-3 gap-y-1.5">
    <span className="text-[14px] text-[var(--color-text-muted)]">{T.resultCount(filtered.length)}</span>
    <select value={S.sort} onChange={e=>act.setSort? null:setS(p=>({...p,sort:e.target.value}))}
     className="ml-auto rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] text-[var(--color-text-secondary)]">
     <option value="priceAsc">{T.sortPrice}</option>
     <option value="dlperf">{T.sortDlperf}</option>
     <option value="rel">{T.sortRel}</option>
    </select>
   </div>
   <div className="mb-2 text-[12px] text-[var(--color-text-muted)]">
    {S.injectedParams ? (
     T.chipTpl(S.injectedParams.diskMin,S.injectedParams.portsMin)
    ) : (
     <span className="text-[var(--color-text-faint)]">{T.noTemplateSelected}</span>
    )}
   </div>
   <div className="space-y-2.5">
    {filtered.map((o,i)=><OfferCard key={o.id} o={o} idx={i} S={S} act={act}/>)}
    {filtered.length===0 && (
     <div className="rounded-xl border border-dashed border-[var(--color-border)] p-10 text-center text-[14px] text-[var(--color-text-muted)]">
      {T.emptyTitle} —— {T.emptyBody}
      {(()=>{
        const f=S.filters;
        const hints=[];
        if(f.priceMin!==""||f.priceMax!=="") hints.push(T.emptyHintPrice);
        if(f.gpuRamMin>0||f.numGpuMin>1) hints.push(T.emptyHintRam);
        if(f.searchModel||f.gpus.length) hints.push(T.emptyHintSearch);
        if(f.locs.length||f.pcies.length) hints.push(T.emptyHintLoc);
        if(f.cpuMin>0||f.ramMin>0) hints.push(T.emptyHintPerf);
        if(f.netUpMin>0||f.netDownMin>0) hints.push(T.emptyHintNet);
        if(f.tpl) hints.push(T.stEmptyTpl);
        if(!hints.length){
          // 默认提供可重置提示
          return <div className="mt-2"><button onClick={()=>act.resetFilters()} className="rounded-lg border border-[var(--color-border)] px-3 py-1 text-[13px] hover:border-[var(--color-border-strong)]">{T.fReset}</button></div>;
        }
        return hints.map((h,i)=><div key={i} className="mt-1.5 text-[13px] text-[var(--color-text-faint)]">{h}</div>);
      })()}
     </div>)}
   </div>
  </section>
 </main>);
}

/* ================= 报价卡（Vast 式列对齐布局） ================= */
const OfferCard = React.memo(function OfferCard({o,idx,S,act}){
 const [tip,setTip]=useState(false);
 const storePart = FREE_DISK*RATE_STORE_RUN;
 const gpuPart = Math.max(o.dph-storePart-0.0004, 0);
 const un = o.verification!=="verified";
 const nz = v=> (v==null||v==="") ? "—" : v;
 const isHost = o.source==="host";
 const isSeed = o.source==="seed";
 const perfTip = o.dlperf==null ? T.ttDlperfPending : T.ttDlperfTip;
 
 // 模板兼容性检查
 const tpl = S.filters.tpl ? TEMPLATES.find(t=>t.id===S.filters.tpl) : null;
 const tplCompat_ = tpl ? tplCompat(o,tpl) : null;
 const isNotPreferred = tplCompat_?.gpuNotPreferred;
 
 return (
  <article onClick={()=>act.openRent(o)} className={`card-in cursor-pointer rounded-xl border bg-[var(--color-surface)] p-3 transition-colors hover:border-[var(--color-border-strong)] hover:bg-white/[0.02] ${un?"border-[var(--color-border)]/60":(isSeed?"border-[var(--color-info)]/40":isHost?"border-amber-500/40":"border-[var(--color-border)]")} ${isNotPreferred?"opacity-60":""}`} style={{animationDelay:`${idx*40}ms`}}>
   {/* 五列对齐：GPU / 主机 / 网络 / DLPerf·可靠性 / 价格·租用；窄屏折行堆叠 */}
   <div className="grid grid-cols-1 gap-2.5 sm:grid-cols-2 lg:grid-cols-[minmax(0,1.3fr)_minmax(0,1.05fr)_minmax(0,0.75fr)_minmax(0,1fr)_auto] lg:items-center lg:gap-0 lg:divide-x lg:divide-[var(--color-border)]/50">
    {/* 列1：GPU */}
    <div className="min-w-0 space-y-0.5 lg:pr-4">
     <div className="flex items-center gap-1.5">
      <h3 className="truncate text-[16px] font-semibold text-[var(--color-text)]">{o.gpu}</h3>
      {o.numGpu!=null&&o.numGpu>1 && <span className="mono shrink-0 text-[12px] font-medium text-[var(--color-text-muted)]">×{o.numGpu}</span>}
      {o.arch && <span className="shrink-0 rounded border border-[var(--color-border)] px-1.5 py-px text-[11px] text-[var(--color-text-faint)]">{o.arch}</span>}
      {isNotPreferred && <span className="shrink-0 rounded bg-amber-500/10 px-1.5 py-px text-[11px] text-amber-500">{T.notPreferred}</span>}
     </div>
     <div className="mono text-[11.5px] text-[var(--color-text-muted)]">{o.tflops!=null?`${Number(o.tflops).toFixed(1)} TFLOPS`:"—"}{o.cuda?` · Max CUDA ${o.cuda}`:""}</div>
     <div className="text-[11px] text-[var(--color-text-muted)]">{T.lblVram}</div>
     <div className="mono text-[13px] font-medium text-[var(--color-text)]">{nz(o.gpuRam)}GB</div>
     <div className="mono text-[11px] text-[var(--color-text-muted)]">{nz(o.memBw)}GB/s{o.pcie?` · PCIe ${o.pcie}`:""}{o.nvlink?" · NVLink":""}</div>
    </div>
    {/* 列2：CPU / 内存·磁盘 */}
    <div className="min-w-0 space-y-0.5 lg:px-4">
     <div className="text-[11px] text-[var(--color-text-muted)] lg:hidden">CPU</div>
     <div className="mono text-[11.5px] font-medium text-[var(--color-text-muted)]">{nz(o.cpuCores)} {T.lblCores}</div>
     <div className="mono truncate text-[10.5px] text-[var(--color-text-faint)]">{nz(o.cpu)}</div>
     <div className="text-[11px] text-[var(--color-text-muted)] lg:hidden">{T.lblRamDisk}</div>
     <div className="mono text-[11.5px] font-medium text-[var(--color-text-muted)]">{nz(o.ram)}GB / {nz(o.disk)}GB</div>
     <div className="mono text-[10.5px] text-[var(--color-text-faint)]">{o.diskBw!=null?`${T.lblDisk} ${o.diskBw}MB/s`:""}</div>
    </div>
    {/* 列3：网络 */}
    <div className="min-w-0 space-y-0.5 lg:px-4">
     <div className="text-[11px] text-[var(--color-text-muted)] lg:hidden">{T.lblNet}</div>
     <div className="mono text-[13px] font-medium text-[var(--color-text)]">↓{nz(o.netDown)} ↑{nz(o.netUp)}</div>
     <div className="mono text-[11px] text-[var(--color-text-muted)]">Mbps{o.ports!=null?` · ${T.lblPorts} ${o.ports}`:""}</div>
    </div>
    {/* 列4：DLPerf · 可靠性（性能实测 + 信任挂账；2026-09-16 命名直白化，叙事留在 tooltip/verified 标签） */}
    <div className="min-w-0 space-y-0.5 lg:px-4" title={perfTip}>
     <div className="text-[11px] text-[var(--color-text-muted)] lg:hidden">{T.lblPerfTrust}</div>
     <div>{o.dlperf!=null ? (<>
       <span className="mono text-[15px] font-semibold leading-tight text-[var(--color-text)]">{Number(o.dlperf).toFixed(1)}</span>
       <span className="text-[11px] font-normal text-[var(--color-accent-hover)]"> DLPerf</span>
      </>) : (<span className="mono text-[11px] text-[var(--color-text-muted)]">—</span>)}</div>
     <div>{o.dlperfPerUsd!=null ? (<>
       <span className="mono text-[13px] font-semibold text-[var(--color-text-secondary)]">{o.dlperfPerUsd}</span>
       <span className="text-[10.5px] text-[var(--color-text-muted)]"> DLP/$/hr</span>
      </>) : (<span className="mono text-[11px] text-[var(--color-text-muted)]">—</span>)}</div>
     <div className="text-[11px] text-[var(--color-text-muted)]">{T.lblReliability} {o.reliability!=null ? <span className="mono text-[12px] font-medium text-[var(--color-text-secondary)]">{o.reliability}%</span> : <span className="mono text-[11px] text-[var(--color-text-muted)]">—</span>}</div>
     <div className="text-[11px] text-[var(--color-text-muted)]">{T.lblMaxDur} <span className="mono text-[var(--color-text-secondary)]">{fmtDur(o.maxDuration)}</span></div>
    </div>
    {/* 列5：价格 + 租用（右侧纵排，对齐 Vast） */}
    <div className="flex shrink-0 items-center justify-between gap-2 sm:col-span-2 lg:col-span-1 lg:min-w-[148px] lg:flex-col lg:items-end lg:justify-center lg:gap-1 lg:pl-4">
     <div className="relative"
      onMouseEnter={()=>setTip(true)} onMouseLeave={()=>setTip(false)}>
      <span className="mono cursor-help text-[19px] font-semibold text-[var(--color-success)]">{fmt$(o.dph,3)}</span>
      <span className="text-[13px] text-[var(--color-text-muted)]">/hr</span>
      {tip && (
        <div className="absolute bottom-full right-0 z-30 mb-1.5 w-52 rise-in rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] p-2.5 text-left shadow-2xl shadow-black/15">
         <div className="mb-1 text-[12px] font-semibold uppercase tracking-wider text-[var(--color-text-muted)]">每小时分解</div>
         {[[T.ttGpu,gpuPart],[T.ttStore10,storePart],[T.ttBw,0.0004]].map(([k,v])=>(
          <div key={k} className="flex justify-between text-[13px]"><span className="text-[var(--color-text-muted)]">{k}</span><span className="mono text-[var(--color-text-secondary)]">{fmt$(v)}</span></div>))}
         <div className="mt-1 border-t border-[var(--color-border)] pt-1 text-[11px] leading-snug text-[var(--color-text-muted)]">{T.ttBwNote}</div>
        </div>)}
     </div>
     <button onClick={e=>{e.stopPropagation();act.openRent(o);}}
      className="inline-flex min-h-[44px] w-auto items-center justify-center rounded-lg bg-[var(--color-accent)] px-5 py-2 text-[16px] font-semibold leading-none text-[var(--color-text)] transition-colors hover:bg-[var(--color-accent-strong)] active:translate-y-[1px] focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-sky-400 lg:w-full">
      {T.rent}

function ModalShell({children,width="max-w-lg",onClose}){
 const boxRef=useRef(null);
 useEffect(()=>{
  const el=boxRef.current; if(!el)return;
  const sel="button,input,textarea,select,a[href]";
  const first=el.querySelectorAll(sel)[0]; if(first)first.focus();
  const onTab=(e)=>{ if(e.key!=="Tab")return;
   const list=[...el.querySelectorAll(sel)].filter(x=>!x.disabled&&x.offsetParent!==null);
   if(!list.length)return;
   const fst=list[0], lst=list[list.length-1];
   if(e.shiftKey&&document.activeElement===fst){lst.focus();e.preventDefault();}
   else if(!e.shiftKey&&document.activeElement===lst){fst.focus();e.preventDefault();}
  };
  document.addEventListener("keydown",onTab);
  return ()=>document.removeEventListener("keydown",onTab);
 },[]);
 return (
 <div className="fixed inset-0 z-50 flex items-center justify-center bg-black/60 p-4 backdrop-blur-[2px]" onMouseDown={e=>{if(e.target===e.currentTarget&&onClose)onClose();}}>
  <div ref={boxRef} role="dialog" aria-modal="true" className={`max-h-[90dvh] w-full overflow-y-auto ${width} rounded-2xl border border-[var(--color-border)] bg-[var(--color-surface)] shadow-2xl shadow-black/20`}>{children}</div>
 </div>);
}

{T.instEmptyPre}

function InstanceCard({it,S,act,setS}){
 const [confirmDel,setConfirmDel]=useState(false);
 const [editing,setEditing]=useState(false);
 const [label,setLabel]=useState("");
 const m=STATUS_META[it.status]||STATUS_META.Creating;
 const ct=it.contractType||"ondemand";
 const isOrder=ct!=="ondemand";
 const remain=it.rentalEnd-S.simT;
 const burn = isOrder? (["Creating","Loading","Connecting","Running","Rebooting"].includes(it.status)? it.dph : 0)
  : (it.status==="Running"? it.dph : it.diskAlloc*RATE_STORE_STOP*(it.status==="Inactive"?1:0.6));
 const runningLike=["Running","Loading","Creating","Connecting"].includes(it.status);
 const isReservedPending = ct==="reserved" && it.status==="Reserved";
 const unamortized=+(it.escrowHold||0).toFixed(2);
 const penaltyPrev=+(unamortized*0.15).toFixed(2);
 const spent = isOrder? (it.amortized||0) : (it.spentTotal||0);
 const barDenom=it.rentalEnd-it.createdAt;
 const barFrac=(isOrder&&!isReservedPending&&Number.isFinite(barDenom)&&barDenom>0)? Math.min(1,Math.max(0,(it.rentalEnd-S.simT)/barDenom)) : null;
 const util=it.status==="Running"? Math.round(60+35*Math.sin(S.simT/83+[...it.key].reduce((a,c)=>a+c.charCodeAt(0),0))) : null;
 const copySsh=()=>{ const cmd=`ssh ubuntu@${it.ip} -p ${it.extPort22}`;
  if(navigator.clipboard?.writeText) navigator.clipboard.writeText(cmd).then(()=>act.toast(T.tCopied)).catch(()=>act.toast(T.tCopyFail));
  else act.toast(T.tCopyFail); };
 const pwrStop = !isOrder && (it.status==="Running" || it.status==="Offline");
 const pwrReboot = it.status==="Running";
 const pwrStart = it.status==="Inactive" || it.status==="Expired";
 const pwrCancel = it.status==="Scheduling";
 // —— Minimal Dashboard v2：stat 4 列 + View Logs/IP·Ports 直出按钮 + ⋯ 菜单移除 ——
 return (
 <article className="group card-in rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-5">
  {/* 标题行：状态 pill + 可编辑名称 + 徽章 */}
  <div className="flex items-center gap-2.5">
   <span className={`flex shrink-0 items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[12px] font-semibold ${m.cls}`}>
    {m.pulse && <span className="dot-pulse h-1.5 w-1.5 rounded-full bg-current"></span>}
    {statusText(m)}
   </span>
   {editing?
    <input autoFocus value={label} onChange={e=>setLabel(e.target.value)} onBlur={()=>setEditing(false)}
     onKeyDown={e=>e.key==="Enter"&&setEditing(false)} placeholder={T.addLabelPh} className="min-w-0 rounded border border-[var(--color-accent)]/60 bg-[var(--color-bg)] px-1.5 py-0.5 text-[16px] font-semibold"/>:
    <h3 onClick={()=>setEditing(true)} className="min-w-0 cursor-text truncate text-[16px] font-semibold text-[var(--color-text)]" title={T.clickLabel}>
     {label || it.template}<span className="ml-1.5 hidden text-[12px] font-normal text-[var(--color-text-muted)] group-hover:inline">{T.clickLabel}</span></h3>}
   {isOrder && <span className="shrink-0 rounded bg-[var(--color-accent)]/15 px-2 py-px text-[11px] font-medium text-[var(--color-accent-hover)]">{isReservedPending?T.cfStartAt:T.cfSkuOrder}</span>}
   {it.debtStopped && <span className="shrink-0 rounded bg-[var(--color-error)]/15 px-2 py-px text-[11px] font-medium text-[var(--color-error)]">{T.bDebtStopped}</span>}
  </div>
  {/* 规格行：GPU 型号 + 镜像截断 + Jupyter 徽标 */}
  <div className="mt-2.5 flex flex-wrap items-center gap-x-3 gap-y-1">
   <span className="text-[13px] text-[var(--color-text-secondary)]">{it.offer.gpu} · {T.iDisk(it.diskAlloc)}</span>
   <span className="truncate text-[12px] text-[var(--color-text-muted)]" title={it.imageTag}>{it.imageTag}</span>
   {it.launchMode==="jupyter" && <span className="rounded bg-[var(--color-info)]/15 px-1.5 py-px text-[11px] text-[var(--color-info)]">Jupyter</span>}
  </div>
  {/* 分隔线 1 */}
  <div className="mt-4 border-t border-[var(--color-border)]/40"></div>
  {/* Stat 4 列：Reserved/Scheduling 态显示时间信息，其余 RATE/SPENT/GPU/IP */}
  {(isReservedPending||it.status==="Scheduling") ? (
   <div className="mt-4 text-[13px] text-[var(--color-text-secondary)]">

   {it.status==="Expired" && (
    <button onClick={()=>act.toast(T.tExpiredRestart)}

function AuthPage({S,act,setS}){
 const [tab,setTab]=useState(S.authTab==="register"?"register":"login");
  const [step,setStep]=useState(0); // 注册三步：0 表单 → 1 模拟邮箱验证码 → 2 注册协议（end-use，PRD §4.10）
  const [email,setEmail]=useState(""); const [pwd,setPwd]=useState(""); const [pwd2,setPwd2]=useState(""); const [code,setCode]=useState("");
  const [agree,setAgree]=useState([false,false,false,false]);
 const [err,setErr]=useState("");
 const emailOk=/^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(email);
 const toggleLang=()=>{const nl=S.lang==="zh"?"en":"zh";try{localStorage.setItem("vast-demo-lang",nl)}catch(e){};setLang(nl);setS(p=>({...p,lang:nl}))};
 const back=()=>setS(p=>({...p,view:(p.authFrom&&p.authFrom!=="auth")?p.authFrom:"landing",authFrom:null}));
  const switchTab=(t)=>{ setTab(t); setStep(0); setCode(""); setErr(""); setAgree([false,false,false,false]); };
  function doLogin(){ setErr("");
   const r=act.loginAccount(email.trim(),pwd);
   if(r==="noAcct") setErr(T.auErrNoAcct); else if(r==="pwdWrong") setErr(T.auErrPwdWrong); else if(r==="banned") setErr(T.auErrBanned);
  }
  function doRegStep1(){ setErr("");
   if(!emailOk) return setErr(T.auErrEmail);
   if(pwd.length<8) return setErr(T.auErrPwdLen);
   if(pwd!==pwd2) return setErr(T.auErrPwdMatch);
   const _ac=loadAdminCfg(); // Admin 联动说明：白名单拦截已移除（MVP P2P 决策 2026-09-15），保留 loadAdminCfg 供封禁联动参考
   if(loadAccounts()[email.trim()]){ switchTab("login"); setErr(T.auErrDup); return; }
   setStep(1);
  }
  function doVerify(){ setErr(""); if(code.trim().length<6) return setErr(T.auErrCode); setStep(2); }
 const lblCls="block text-[13px] text-[var(--color-text-muted)]";
 const inputCls="mono mt-1 w-full rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] px-3 py-2 text-[14px]";
 const primaryBtn="w-full rounded-lg bg-[var(--color-accent)] py-2 text-[15px] font-semibold text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]";
 return (
  <div className="flex min-h-screen flex-col">
   {/* 品牌条：logo + 返回 + 语言切换（该视图不渲染控制台 Header） */}
   <div className="border-b border-[var(--color-border)] px-5 py-3">
    <div className="mx-auto flex max-w-[1400px] items-center justify-between">
     <button onClick={back} className="flex items-baseline gap-2" aria-label={T.auBack}>
      <span className="text-[17px] font-semibold tracking-tight">GPU<span className="text-emerald-400">·</span>Market</span>
      <span className="rounded border border-[var(--color-border)] px-1 py-px text-[11px] uppercase tracking-wider text-[var(--color-text-muted)]">demo</span>
     </button>
     <div className="flex items-center gap-2">
      <button onClick={toggleLang} title={S.lang==="zh"?"Switch to English":"切换到中文"}
       className="rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] font-semibold text-[var(--color-text-muted)] hover:border-[var(--color-border-strong)] hover:text-[var(--color-text)]">
       {S.lang==="zh"?"EN":"中"}
      </button>
      <button onClick={back} title={T.auBack}
       className="rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] font-semibold text-[var(--color-text-muted)] hover:border-[var(--color-border-strong)] hover:text-[var(--color-text)]">← {T.auBack}</button>
     </div>
    </div>
   </div>
   <div className="flex flex-1 items-start justify-center px-5 py-14">
    <div className="w-full max-w-sm">
     {S.pendingOffer && (
      <p className="mb-4 rounded-lg border border-[var(--color-info)]/30 bg-[var(--color-info)]/[.07] px-3.5 py-2.5 text-[13px] leading-snug text-[var(--color-text-secondary)]">{T.auPendingLead}</p>)}
     <div className="rise-in rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6">
      <h1 className="text-[19px] font-semibold tracking-tight">{tab==="login"?T.auLoginTitle:T.auRegTitle}</h1>
      {/* tabs */}
      <div className="mt-4 grid grid-cols-2 gap-1 rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] p-1">
       {[["login",T.auTabLogin],["register",T.auTabRegister]].map(([t,l])=>(
        <button key={t} onClick={()=>switchTab(t)}
         className={`rounded-md py-1.5 text-[13.5px] font-medium ${tab===t?"border border-[var(--color-border-strong)] bg-[var(--color-surface)] text-[var(--color-text)]":"text-[var(--color-text-muted)] hover:text-[var(--color-text-secondary)]"}`}>{l}</button>))}
      </div>
      {/* OAuth 一键（首登=注册，账号库联动；注册验证码步骤隐藏，保持单焦点——审查 P1 修复） */}
      {(tab==="login" || step===0) && (
      <div>
       <div className="mt-5 space-y-2">
        <button onClick={()=>act.oauthLogin("google")} className="flex w-full items-center justify-center gap-2 rounded-lg border border-[var(--color-border-strong)] py-2 text-[14px] text-[var(--color-text-secondary)] hover:border-[var(--color-text-faint)]">

       <div className="my-5 flex items-center gap-3 text-[12px] text-[var(--color-text-faint)]"><span className="h-px flex-1 bg-[var(--color-border)]"></span>{T.auOr}<span className="h-px flex-1 bg-[var(--color-border)]"></span></div>
      </div>)}
      {/* 表单区 */}
      {tab==="login" ? (
       <form onSubmit={e=>{e.preventDefault();doLogin();}} className="space-y-3">
        <label className={lblCls}>{T.auEmail}
         <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} placeholder={T.auEmailPh} autoComplete="email" className={inputCls}/></label>
        <label className={lblCls}>{T.auPwd}
         <input type="password" value={pwd} onChange={e=>{setPwd(e.target.value);setErr("");}} placeholder={T.auPwdPh} autoComplete="current-password" className={inputCls}/></label>
        {err && <p className="text-[12.5px] text-red-400">{err}</p>}

       </form>
      ) : step===0 ? (
       <form onSubmit={e=>{e.preventDefault();doRegStep1();}} className="space-y-3">
        <label className={lblCls}>{T.auEmail}
         <input type="email" value={email} onChange={e=>{setEmail(e.target.value);setErr("");}} placeholder={T.auEmailPh} autoComplete="email" className={inputCls}/></label>
        <label className={lblCls}>{T.auPwd}

        <label className={lblCls}>{T.auPwd2}
         <input type="password" value={pwd2} onChange={e=>{setPwd2(e.target.value);setErr("");}} placeholder={T.auPwdPh} autoComplete="new-password" className={inputCls}/></label>
        {err && <p className="text-[12.5px] text-red-400">{err}</p>}

         <button type="submit" disabled={code.length<6} className={`w-full rounded-lg py-2 text-[15px] font-semibold ${code.length>=6?"bg-[var(--color-accent)] text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]":"cursor-not-allowed bg-[var(--color-surface-alt)] text-[var(--color-text-faint)]"}`}>{T.auVerifyBtn}</button>

          <p className="text-[12px] leading-snug text-[var(--color-text-faint)]">{T.enduseRestrictedNote}</p>

         <div className="flex gap-2">
          <button type="button" onClick={()=>setStep(1)} className="rounded-lg border border-[var(--color-border)] px-3.5 py-2 text-[14px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)]">{T.wzPrev}</button>
           <button type="button" disabled={!agree.every(Boolean)} onClick={()=>{setErr("");act.register(email.trim(),pwd,agree);}}
           className={`flex-1 rounded-lg py-2 text-[15px] font-semibold ${agree.every(Boolean)?"bg-[var(--color-accent)] text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]":"cursor-not-allowed bg-[var(--color-surface-alt)] text-[var(--color-text-faint)]"}`}>{T.enduseOk}</button>
         </div>
        </div>
       )}
      {/* tab 底部互切 */}
      <p className="mt-5 border-t border-[var(--color-border)] pt-4 text-center text-[13px] text-[var(--color-text-muted)]">
       {tab==="login" ? <>{T.auNoAcct} <button onClick={()=>switchTab("register")} className="font-medium text-[var(--color-accent-hover)] hover:underline">{T.auGoReg}</button></>
        : <>{T.auHaveAcct} <button onClick={()=>switchTab("login")} className="font-medium text-[var(--color-accent-hover)] hover:underline">{T.auGoLogin}</button></>}
      </p>
     </div>
    </div>
   </div>
  </div>
 );
}

/* ================= Billing 页（租户结算） ================= */
function BillingPage({S,act,setS}){
  // 租客侧口径排除 legacy 底数流水（宿主预置历史收入，非本租客消费）
  const _tl=S.ledger.filter(e=>!e.legacy);
  // 累计消费构成：按量三组件 + 订单预付款摊销（lgAmort 归入 GPU 算力，修正订单用户构成空账）
  const gpuSum=_tl.filter(e=>e.msgKey==="lgGpu"||e.msgKey==="lgAmort").reduce((a,e)=>a+(e.amt||0),0);
  const stoSum=_tl.filter(e=>e.msgKey==="lgStoreStop").reduce((a,e)=>a+(e.amt||0),0);
  const bwSum=_tl.filter(e=>e.msgKey==="lgBw").reduce((a,e)=>a+(e.amt||0),0);
  const tot=gpuSum+stoSum+bwSum;
  const pct=v=>tot>0?Math.max(v/tot*100,2):0;
  // 当前余额：可用 vs 冻结（冻结=按量全局预留 + 订单 per-instance escrowHold，修正旧面板漏计订单冻结）
  const avail=+((S.balance)||0).toFixed(4);
  const odHold=+((S.escrow)||0).toFixed(4);
  const orderHold=+(S.instances||[]).reduce((a,i)=>a+(((i.contractType||"ondemand")!=="ondemand")?(i.escrowHold||0):0),0).toFixed(4);
  const frozen=+(odHold+orderHold).toFixed(4);
  // 流水方向白名单：正向=回流余额；负向=真实支出；中性=订单预付款内部核销（下单已全额扣款，不参与求和）
  const POS=new Set(["lgTopup","lgRefund"]);
  const NEUTRAL=new Set(["lgAmort","lgPenalty"]);
  const rows=_tl.filter(e=>e.amt!=null).slice(0,14); // 先过滤再截断（修正旧 slice→filter 致不足 14 条）
 return (
  <main className="mx-auto max-w-[1400px] px-5 pt-4">
   <div className="grid gap-4 lg:grid-cols-2">
    {/* 当前余额（主卡片：回答「我还有多少钱」） */}
    <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 lg:col-span-2">
     <h3 className="mb-3 flex items-center gap-1.5 text-[15px] font-semibold">{T.blBalTitle}<InfoTip side="left" label={T.blLifeTitle} text={T.blLifeTip}/></h3>
     <div className="grid grid-cols-1 gap-4 sm:grid-cols-3">
      <div className="rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] p-3">
       <div className="mb-1 text-[13px] font-medium text-[var(--color-text-secondary)]">{T.blBalAvail}</div>
       <div className="mono text-[24px] font-bold text-[var(--color-text)]">{fmt$(avail)}</div>
      </div>
      <div className="rounded-lg border border-[var(--color-info)]/30 bg-[var(--color-info)]/[.05] p-3">
       <div className="mb-1 text-[13px] font-medium text-[var(--color-text-secondary)]">{T.blBalFrozen}</div>
       <div className="mono text-[24px] font-bold text-[var(--color-info)]">{fmt$(frozen)}</div>
       <div className="mt-1 text-[12px] text-[var(--color-text-muted)]">{T.blBalFrozenBreak(fmt$(odHold),fmt$(orderHold))}</div>
      </div>
      <div className="rounded-lg border border-[var(--color-success)]/30 bg-[var(--color-success)]/[.05] p-3">
       <div className="mb-1 text-[13px] font-medium text-[var(--color-text-secondary)]">{T.blBalTotal}</div>
       <div className="mono text-[24px] font-bold text-[var(--color-success)]">{fmt$(+(avail+frozen).toFixed(2))}</div>
       <div className="mt-1 text-[12px] text-[var(--color-text-muted)]">{T.blBalTotalNote}</div>
      </div>
     </div>
     <p className="mt-3 text-[12.5px] leading-snug text-[var(--color-text-muted)]">{T.escrowNote}</p>
    </section>
    {/* 累计消费构成（三组件） */}
    <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 lg:col-span-2">
     <h3 className="mb-3 text-[15px] font-semibold">{T.blMixTitle}</h3>
     <div className="mb-4 grid grid-cols-3 gap-4">
      {[
       [T.blMixGpu,gpuSum,"bg-[var(--color-success)]",T.blMixGpuDesc],
       [T.blMixSto,stoSum,"bg-[var(--color-accent)]",T.blMixStoDesc],
       [T.blMixBw,bwSum,"bg-[var(--color-info)]",T.blMixBwDesc]
      ].map(([k,v,c,desc])=>(
      <div key={k} className="rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] p-3">
       <div className="mb-1 text-[13px] font-medium text-[var(--color-text-secondary)]">{k}</div>
       <div className="mono text-[20px] font-semibold text-[var(--color-text)]">{fmt$(v)}</div>
       <div className="mt-1 text-[12px] text-[var(--color-text-muted)]">{desc}</div>
       <div className="mt-2 h-1.5 rounded-full bg-[var(--color-surface)]"><div className={`h-1.5 rounded-full ${c}`} style={{width:pct(v)+"%"}}></div></div>
      </div>))}
     </div>
     <div className="rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] p-3">
      <div className="flex justify-between text-[14px]"><span className="text-[var(--color-text-muted)]">Total</span><span className="mono font-semibold text-[var(--color-text)]">{fmt$(tot)}</span></div>
     </div>
    </section>
    {/* 交易流水 */}
   <section className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4 lg:col-span-2">
    <div className="mb-2 flex items-center gap-2">
     <h3 className="text-[15px] font-semibold">{T.blTxTitle}</h3>
     <div className="ml-auto rounded-md bg-[var(--color-surface)] px-2.5 py-1 text-[13px] text-[var(--color-text)]">{T.blTabCharges}</div>
    </div>
    {rows.length? (
      <div className="overflow-x-auto">
      <table className="w-full text-left mono text-[13.5px]">
        <thead><tr className="border-b border-[var(--color-border)] text-[12px] uppercase tracking-wider text-[var(--color-text-faint)]"><th className="py-1.5">{T.blThTime}</th><th>{T.blThItem}</th><th className="text-right">{T.blThAmt}</th><th className="text-right">{T.blThBal}</th><th className="hidden text-right md:table-cell">{T.blThId}</th></tr></thead>
        <tbody>{rows.map((e,i)=>{
         const pos=POS.has(e.msgKey), neutral=NEUTRAL.has(e.msgKey);
         return (
         <tr key={e.txnId||("lg-"+i)} className="border-b border-[var(--color-border)]/40">
          <td className="py-1.5 text-[var(--color-text-muted)]">{fmtClock(e.t)}</td>
          <td className="text-[var(--color-text-secondary)]">{T[e.msgKey]||e.msgKey}{e.sid?` · ${e.sid}`:""}{e.gpu?` · ${e.gpu}`:""}{e.bwGb?` · ${(+e.bwGb).toFixed(2)} GB`:""}{neutral?<span className="ml-1.5 rounded bg-[var(--color-border)]/30 px-1 py-px text-[11px] text-[var(--color-text-faint)]">{T.blTxSplit}</span>:null}</td>
          <td className={`text-right ${neutral?"text-[var(--color-text-muted)]":pos?"text-[var(--color-success)]":"text-[var(--color-warning)]/90"}`}>{neutral?"":(pos?"+":"-")}{fmt$(e.amt)}</td>
          <td className="text-right text-[var(--color-text-muted)]">{e.balAfter==null?"—":fmt$(e.balAfter)}</td>
          <td className="hidden text-right text-[12px] text-[var(--color-text-faint)] md:table-cell">{e.txnId||"—"}</td>
         </tr>);})}
        </tbody></table>
      </div>
      ):<p className="py-6 text-center text-[13px] text-[var(--color-text-faint)]">{T.ledEmpty}</p>}
   </section>
  </div>
 </main>);
}

/* ================= 宿主侧 · Machines 页 ================= */
/* Minimal Dashboard v3（2026-09-18 · B' 全宽压缩）：与实例卡共享全宽横条范式但按内容密度压段——标题区（pill+名称｜规格·位置·押金右锚）→ 核心行（GPU 主价格+STORE/NET/CONTRACTS inline 左锚｜操作右锚）→ 排障行；实名=账号级 KYC 收纳页头 chip */
function HostMachinesPage({S,act,setS}){
 const [confirming,setConfirming]=useState(null);
 const [expanded,setExpanded]=useState(null);       // 合同明细展开机器 id（单开）
 const [editing,setEditing]=useState(null);         // 改价面板 {id, relist?}（relist=重上架前置补期）
 const [editF,setEditF]=useState(null);             // 改价表单值 {dph,net,sto,endDate}
 const [relistConf,setRelistConf]=useState(null);   // 重上架 inline 确认机器 id
 // 合同派生（2026-09-18 · P0-1 口径）：instances 在列即活跃（订单到期自动出列/销毁即移除，按量无租期概念）；
 // bookings 须未过期（b.endAt>simT，过期残留剔除）；+ seed 存量底数（SEED_CONTRACTS 时间按 simT 动态换算）
 const contractsOf=(m)=>{
  const oid="host-"+m.id;
  const inst=(S.instances||[]).filter(i=>i.offerId===oid);
  const bks=(S.bookings||[]).filter(b=>b.offerId===oid&&b.endAt>S.simT);
  const seedC=(SEED_CONTRACTS[m.id]||[]).map(c=>({...c,from:S.simT+c.fromOff,end:c.endOff!=null?S.simT+c.endOff:null}));
  return {inst,bks,seedC,total:inst.length+bks.length+seedC.length};
 };
 return (
  <main className="mx-auto max-w-[1400px] px-5 pt-4">
   <div className="mb-3 flex flex-wrap items-center justify-between gap-2">
     <div className="flex items-center gap-1.5">
      <h2 className="text-[17px] font-semibold">{T.hmTitle}</h2>
       <InfoTip side="left" label={T.hmWarn} text={T.hmWarn}/>
      {/* 账号级实名状态（宿主主体 KYC 一次，全账号机器生效）——从机器卡移至页头，每页一次 */}
      {S.hostRealname===true && <span title={T.hmRealnameChipTip} className="flex shrink-0 items-center gap-1 rounded-full border border-[var(--color-success)]/40 bg-[var(--color-success)]/10 px-2 py-0.5 text-[11.5px] font-medium text-[var(--color-success)]">✓ {T.hmRealnameChip}</span>}
     </div>
    <button onClick={()=>setS(p=>({...p,modal:"wizard"}))} className="flex items-center gap-1.5 rounded-lg bg-[var(--color-success)] px-3.5 py-1.5 text-[14px] font-semibold text-[var(--color-text)] hover:bg-[var(--color-success)] active:translate-y-px"><Icon d={P.plus} size={13}/>{T.hmListBtn}</button>
   </div>
  <div className="space-y-3">
    {S.hostMachines.map(m=>(
    <article key={m.id} className="card-in rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-4">
     {/* 三段横排（Minimal Dashboard v3.1）：身份｜价格带 flex-1 均布｜操作——静态报价卡内容恒定，用结构消化全宽空白而非塞数据 */}
     <div className="flex flex-col gap-3 lg:flex-row lg:items-center lg:gap-6">
      {/* 左·身份块：状态 pill + 名称 + seed 徽章 / 规格·位置·押金 / 排障 footer（footer 并入使卡片纵向减半） */}
      <div className="min-w-0 lg:w-[300px] lg:shrink-0">
       <div className="flex items-center gap-2.5">
        <span className={`flex shrink-0 items-center gap-1.5 rounded-full border px-2.5 py-0.5 text-[12px] font-semibold ${m.status==="listed"?"border-[var(--color-success)]/40 bg-[var(--color-success)]/10 text-[var(--color-success)]":m.status==="maintenance"?"border-[var(--color-warning)]/40 bg-[var(--color-warning)]/10 text-[var(--color-warning)]":m.status==="offline"?"border-[var(--color-error)]/40 bg-[var(--color-error)]/10 text-[var(--color-error)]":"border-[var(--color-border)] bg-[var(--color-bg)] text-[var(--color-text-muted)]"}`}>
         {m.status==="listed" && <span className="dot-pulse h-1.5 w-1.5 rounded-full bg-current"></span>}
         {m.status}
         {m.status==="offline" && <span className="dot-pulse h-1.5 w-1.5 rounded-full bg-current"></span>}
        </span>
        <h3 className="min-w-0 truncate text-[16px] font-semibold text-[var(--color-text)]">{m.name}</h3>
        {m.seed && <span className="shrink-0 rounded bg-[var(--color-info)]/10 px-1.5 py-px text-[11px] text-[var(--color-info)]" title={T.srcSeedTitle}>{T.srcSeedLbl}</span>}
       </div>
       <div className="mt-1.5 truncate text-[12.5px] text-[var(--color-text-faint)]">
        {m.spec}{m.geoloc?` · ${m.geoloc}`:""}{!m.seed&&m.deposit>0?` · ${T.hmDeposit} $${m.deposit.toFixed(0)}`:""}
       </div>
       <div className="mono mt-1 truncate text-[10.5px] text-[var(--color-text-faint)]">{m.id} · offer end {m.endDate}</div>
      </div>
      {/* 中·价格带：GPU 主价格 20px + STORE/NET/CONTRACTS 均布；divider 用显式元素（divide-x 在 wrap 换行会误画次行行首界线） */}
      <div className="flex min-w-0 flex-1 flex-wrap items-center justify-around gap-x-5 gap-y-2">
       <div>
        <div className="text-[10px] uppercase tracking-widest text-[var(--color-text-faint)]">GPU</div>
        <div className="mono mt-0.5 text-[20px] font-semibold text-[var(--color-success)]">${(+(m.dph)||0).toFixed(2)}<span className="text-[11px] font-normal text-[var(--color-text-faint)]">/hr</span></div>
       </div>
       <span className="hidden lg:block h-8 w-px bg-[var(--color-border)]"></span>
       <div>
        <div className="text-[10px] uppercase tracking-widest text-[var(--color-text-faint)]">STORE</div>
        <div className="mono mt-0.5 text-[13px] font-medium text-[var(--color-text)]">${(+(m.sto)||0).toFixed(3)}<span className="text-[10.5px] font-normal text-[var(--color-text-faint)]">/GB</span></div>
       </div>
       <span className="hidden lg:block h-8 w-px bg-[var(--color-border)]"></span>
       <div>
        <div className="text-[10px] uppercase tracking-widest text-[var(--color-text-faint)]">NET</div>
        <div className="mono mt-0.5 text-[13px] font-medium text-[var(--color-text)]">${(+(m.net)||0).toFixed(3)}<span className="text-[10.5px] font-normal text-[var(--color-text-faint)]">/GB</span></div>
       </div>
       <span className="hidden lg:block h-8 w-px bg-[var(--color-border)]"></span>
       {/* 合同计数=渲染期派生（真实成交+未过期他人预订+seed 底数），点击展开明细 */}
       <div>
        <button onClick={()=>setExpanded(x=>x===m.id?null:m.id)} aria-expanded={expanded===m.id} className="group text-left">
         <div className="text-[10px] uppercase tracking-widest text-[var(--color-text-faint)] group-hover:text-[var(--color-text-secondary)]">CONTRACTS</div>
         <div className={`mono mt-0.5 text-[13px] font-medium ${contractsOf(m).total>0?"text-[var(--color-success)]":"text-[var(--color-text-muted)]"}`}>{contractsOf(m).total}</div>
        </button>
       </div>
      </div>
      {/* 右·操作：改价/维护/下架（inline 二次确认对齐实例卡 Destroy 模式）；确认框瞬时挤压由中段 min-w-0/flex-wrap 兜底 */}
      <div className="flex flex-wrap items-center gap-2 lg:shrink-0">
        {/* 改价入口：listed/maintenance 可改（removed 无出边）；合同冻结=只影响新订单 */}
        {m.status!=="removed" && (editing?.id===m.id ? (
         <button onClick={()=>setEditing(null)} className="flex items-center gap-1.5 rounded-lg border border-[var(--color-border-strong)] px-3 py-1.5 text-[13px] text-[var(--color-text-secondary)] hover:text-[var(--color-text)]"><Icon d={P.x} size={12}/>{T.hmEditCancel}</button>
        ) : (
         <button onClick={()=>{setEditF({dph:m.dph,net:m.net,sto:m.sto,endDate:m.endDate||""});setEditing({id:m.id});setExpanded(null);setRelistConf(null);}}
          className="flex items-center gap-1.5 rounded-lg border border-[var(--color-border-strong)] px-3 py-1.5 text-[13px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)] hover:text-[var(--color-text)] active:translate-y-px"><Icon d={P.dollar} size={12}/>{T.hmEditBtn}</button>
        ))}
        {/* 状态机出边决定按钮：removed 终态唯一受控出边=重新上架（报价期已过先补期）；其余态只读说明 */}
        {m.status==="removed" ? (
         relistConf===m.id ? (
          <div className="flex items-center gap-2 rounded-lg border border-[var(--color-success)]/50 bg-[var(--color-success)]/10 px-3 py-1.5">
           <span className="text-[12px] leading-tight text-[var(--color-success)]">{T.hmRelistConfirm}</span>
           <button onClick={()=>{
             const expired=!m.endDate||new Date(m.endDate+"T23:59:59")<Date.now();
             if(expired){ setEditF({dph:m.dph,net:m.net,sto:m.sto,endDate:m.endDate||""}); setEditing({id:m.id,relist:true}); setRelistConf(null); } // 报价期已过→先经改价面板补期（maxDuration 由 endDate 推算）
             else { act.machineRelist(m.id); act.toast(T.hmRelistToast); setRelistConf(null); }
            }} className="shrink-0 rounded bg-[var(--color-success)] px-2 py-0.5 text-[12px] font-semibold text-[var(--color-text)]">{T.hmRelistBtn}</button>
           <button onClick={()=>setRelistConf(null)} className="shrink-0 rounded border border-[var(--color-border-strong)] px-2 py-0.5 text-[12px] text-[var(--color-text-secondary)]">{T.btnCancel}</button>
          </div>
         ) : (
          <>
           <span className="text-[12px] text-[var(--color-text-muted)]">{T.hmRemovedNote}</span>
           <button onClick={()=>setRelistConf(m.id)} className="flex items-center gap-1.5 rounded-lg border border-[var(--color-success)]/40 px-3 py-1.5 text-[13px] text-[var(--color-success)] hover:bg-[var(--color-success)]/10 active:translate-y-px"><Icon d={P.refresh} size={12}/>{T.hmRelistBtn}</button>
          </>
         )
        ) : (<>
        {confirming?.id===m.id&&confirming.action==="maint" ? (
        <div className="flex items-center gap-2 rounded-lg border border-[var(--color-warning)]/50 bg-[var(--color-warning)]/10 px-3 py-1.5">
         <span className="text-[12px] leading-tight text-[var(--color-warning)]">{T.hmMaintConfirm}</span>
         <button onClick={()=>{act.machineMaint(m.id);act.toast(T.hmMaintToast);setConfirming(null);}} className="shrink-0 rounded bg-[var(--color-warning)] px-2 py-0.5 text-[12px] font-semibold text-[var(--color-text)]">{T.btnConfirm}</button>
         <button onClick={()=>setConfirming(null)} className="shrink-0 rounded border border-[var(--color-border-strong)] px-2 py-0.5 text-[12px] text-[var(--color-text-secondary)]">{T.btnCancel}</button>
        </div>
       ) : (
        <button onClick={()=>setConfirming(c=>c?.id===m.id&&c.action==="maint"?null:{id:m.id,action:"maint"})}
         className="flex items-center gap-1.5 rounded-lg border border-[var(--color-border-strong)] px-3 py-1.5 text-[13px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)] hover:text-[var(--color-text)] active:translate-y-px"><Icon d={m.status==="maintenance"?P.play:P.stop} size={12}/>{m.status==="maintenance"?T.mRestore:T.hmMaintBtn}</button>
       )}
       {confirming?.id===m.id&&confirming.action==="delist" ? (
        <div className="flex items-center gap-2 rounded-lg border border-[var(--color-error)]/50 bg-[var(--color-error)]/10 px-3 py-1.5">
         <span className="text-[12px] leading-tight text-[var(--color-error)]">{T.hmDelistConfirm}</span>
         <button onClick={()=>{act.machineDelist(m.id);act.toast(T.hmDelistToast);setConfirming(null);}} className="shrink-0 rounded bg-[var(--color-error)] px-2 py-0.5 text-[12px] font-semibold text-[var(--color-text)]">{T.hmDelistBtn}</button>
         <button onClick={()=>setConfirming(null)} className="shrink-0 rounded border border-[var(--color-border-strong)] px-2 py-0.5 text-[12px] text-[var(--color-text-secondary)]">{T.btnCancel}</button>
        </div>
       ) : (
        <button onClick={()=>setConfirming(c=>c?.id===m.id&&c.action==="delist"?null:{id:m.id,action:"delist"})}
         className="flex items-center gap-1.5 rounded-lg border border-[var(--color-error)]/40 px-3 py-1.5 text-[13px] text-red-400 hover:bg-[var(--color-error)]/10 active:translate-y-px"><Icon d={P.trash} size={12}/>{T.hmDelistBtn}</button>
        )}
       </>)}
        </div>
      </div>
      {/* 合同明细（派生只读）：租客标注 · SKU · 锁价 · 起止 · 状态 */}
      {expanded===m.id && (()=>{ const c=contractsOf(m);
       const skuLb=s=>s==="ondemand"?T.hmCtSkuOd:(s==="order"?T.hmCtSkuOrder:T.hmCtSkuResv);
       const rows=[
        ...c.inst.map(i=>({key:i.key||i.shortId,who:T.hmCtMe,sku:i.contractType||"ondemand",dph:i.dph,from:i.createdAt,end:(i.contractType||"ondemand")==="ondemand"?null:i.rentalEnd,wait:i.status==="Reserved"})),
        ...c.bks.map(b=>({key:"bk-"+b.startAt,who:T.hmCtOther,sku:"reserved",dph:m.dph,from:b.startAt,end:b.endAt,wait:b.startAt>S.simT})),
        ...c.seedC.map(s=>({key:s.id,who:T.hmCtSeed,sku:s.sku,dph:s.dph,from:s.from,end:s.end,wait:false})),
       ];
       return (
       <div className="mt-3 border-t border-[var(--color-border)]/60 pt-3">
        <div className="mb-2 text-[13px] font-semibold">{T.hmCtTitle}</div>
        {rows.length? (
         <div className="overflow-x-auto"><table className="w-full text-left mono text-[12.5px]">
          <thead><tr className="border-b border-[var(--color-border)] text-[11px] uppercase tracking-wider text-[var(--color-text-faint)]"><th className="py-1.5 pr-3">{T.hmCtMe}/{T.hmCtOther}</th><th className="pr-3">SKU</th><th className="pr-3">$/hr</th><th className="pr-3">{T.hmCtThTerm}</th><th className="text-right">{T.hmCtThStatus}</th></tr></thead>
          <tbody>{rows.map(r=>{ const expired=r.end&&r.end<S.simT; return (
           <tr key={r.key} className="border-b border-[var(--color-border)]/40">
            <td className="py-1.5 pr-3"><span className={`rounded px-1 py-px text-[11px] ${r.who===T.hmCtMe?"bg-[var(--color-accent)]/10 text-[var(--color-accent-hover)]":r.who===T.hmCtSeed?"bg-[var(--color-info)]/10 text-[var(--color-info)]":"bg-[var(--color-border)]/25 text-[var(--color-text-secondary)]"}`}>{r.who}</span>{r.tenant?` ${r.tenant}`:""}</td>
            <td className="pr-3 text-[var(--color-text-secondary)]">{skuLb(r.sku)}</td>
            <td className="pr-3 text-[var(--color-text-secondary)]">${(+(r.dph)||0).toFixed(2)}</td>
            <td className="pr-3 text-[var(--color-text-muted)]">{r.from?fmtDay(r.from):"—"} → {r.end?fmtDay(r.end):T.hmCtOngoing}</td>
            <td className="text-right">{r.wait?<span className="text-[var(--color-accent-hover)]">{T.hmCtWaitStart}</span>:expired?<span className="text-[var(--color-text-faint)]">{T.hmCtExpired}</span>:<span className="text-[var(--color-success)]">{T.hmCtActive}</span>}</td>
           </tr>);})}
          </tbody></table></div>
        ):<p className="text-[12.5px] text-[var(--color-text-faint)]">{T.hmCtNone}</p>}
       </div>);})()}
      {/* 改价面板（inline）：dph/net/sto/endDate；重上架前置补期时复用（editing.relist） */}
      {editing?.id===m.id && editF && (
       <div className="mt-3 space-y-2 rounded-lg border border-[var(--color-accent)]/30 bg-[var(--color-accent)]/[.04] p-3">
        {editing.relist && <p className="text-[12.5px] font-medium text-[var(--color-warning)]">{T.hmRelistHint}</p>}
        <div className="grid grid-cols-2 gap-2 sm:grid-cols-4">
         <label className="block text-[12px] text-[var(--color-text-muted)]">GPU $/hr
          <input type="number" step="0.01" min="0" value={editF.dph} onChange={e=>setEditF(o=>({...o,dph:e.target.value}))} aria-label="GPU price"
           className="mono mt-1 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] text-[var(--color-text-secondary)]"/></label>
         <label className="block text-[12px] text-[var(--color-text-muted)]">{T.hmNet} $/GB
          <input type="number" step="0.001" min="0" value={editF.net} onChange={e=>setEditF(o=>({...o,net:e.target.value}))} aria-label="Network price"
           className="mono mt-1 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] text-[var(--color-text-secondary)]"/></label>
         <label className="block text-[12px] text-[var(--color-text-muted)]">{T.hmSto} $/GB
          <input type="number" step="0.001" min="0" value={editF.sto} onChange={e=>setEditF(o=>({...o,sto:e.target.value}))} aria-label="Storage price"
           className="mono mt-1 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] text-[var(--color-text-secondary)]"/></label>
         <label className="block text-[12px] text-[var(--color-text-muted)]">{T.hmEditEnd}
          <input type="date" value={editF.endDate} onChange={e=>setEditF(o=>({...o,endDate:e.target.value}))} aria-label={T.hmEditEndAria}
           className="mono mt-1 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[13px] text-[var(--color-text-secondary)]"/></label>
        </div>
        <p className="text-[12px] leading-snug text-[var(--color-text-faint)]">{T.hmEditNote}</p>
        <div className="flex justify-end gap-2">
         <button onClick={()=>setEditing(null)} className="rounded-lg border border-[var(--color-border-strong)] px-3 py-1 text-[13px] text-[var(--color-text-secondary)]">{T.hmEditCancel}</button>
         <button disabled={!(+editF.dph>0)||!editF.endDate} onClick={()=>{
           act.machineEditPrice(m.id,{...editF,dph:+editF.dph,net:+editF.net,sto:+editF.sto});
           if(editing.relist){ act.machineRelist(m.id); act.toast(T.hmRelistToast); } // 补期后完成重上架出边
           setEditing(null);
          }} className={`rounded-lg px-3.5 py-1 text-[13px] font-semibold ${(+editF.dph>0&&editF.endDate)?"bg-[var(--color-accent)] text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]":"cursor-not-allowed bg-[var(--color-surface)] text-[var(--color-text-faint)]"}`}>{editing.relist?T.hmRelistBtn:T.hmEditApply}</button>
        </div>
       </div>
      )}
      </article>))}
  </div>
  </main>);
}

/* ================= 上架向导（三步 · Agent 模式 2026-09-16）=================
   流程：安装 Agent（token 绑定宿主账号）→ Agent 联网注册+自检（硬件事实源，只读）→ 平台实测（阻塞）→ 定价发布。
   硬件参数=Agent 唯一事实源（宿主不填，杜绝谎报面）；宿主仅输入商业条件（名称/价格/租期/押金/实名）。 */
// Agent 上报 mock 池：每套含全字段+平台实测值（防缺字段渲染回归）；重开向导=另一台机器（不持久化，演示语义）
const AGENT_MOCKS=[
 {gpuName:"RTX 4090",numGpu:1,gpuRam:24,memBw:1008,pcie:4.0,arch:"Ada Lovelace",nvlink:false,cpuCores:64,ram:128,netUp:1000,netDown:1000,geoloc:"Shenzhen · CN",tflops:82.6,cuda:"12.8",dlperf:84.2},
 {gpuName:"RTX 5090",numGpu:2,gpuRam:32,memBw:1792,pcie:5.0,arch:"Blackwell",nvlink:false,cpuCores:128,ram:256,netUp:2500,netDown:2500,geoloc:"Hong Kong · HK",tflops:209.5,cuda:"13.0",dlperf:196.4},
 {gpuName:"A100 80GB PCIe",numGpu:4,gpuRam:80,memBw:2039,pcie:4.0,arch:"Ampere",nvlink:false,cpuCores:128,ram:512,netUp:10000,netDown:10000,geoloc:"Singapore · SG",tflops:624.0,cuda:"12.8",dlperf:718.5}
];
function ListWizardModal({S,act,setS}){
 const [step,setStep]=useState(0);
 const [token]=useState(()=>"nx_live_"+Math.random().toString(36).slice(2,10));
 const [rep,setRep]=useState(null);        // Agent 上报（事实源 · 只读）
 const [conn,setConn]=useState(null);      // null | connecting | online
 const [chk,setChk]=useState([false,false,false,false]);
 const [bench,setBench]=useState(null);    // null | running | passed（阻塞式：通过才解锁定价）
 const [pct,setPct]=useState(0);
 const [f,setF]=useState({name:"",gpuPrice:0.4,netPrice:0.02,stoPrice:0.19,endDate:"2026-12-31",deposit:0});
 const timers=useRef([]);
 const later=id=>timers.current.push(id);
 useEffect(()=>()=>timers.current.forEach(id=>{clearTimeout(id);clearInterval(id);}),[]);
 const allChk=chk.every(Boolean);
 const F=(k,label,type="number",stepAttr,extra)=>
  <label className="block text-[13px] text-[var(--color-text-muted)]">{label}
   <input type={type} step={stepAttr} value={f[k]} onChange={e=>setF(o=>({...o,[k]:type==="number"?+e.target.value:e.target.value}))}
    aria-label={label} className="mono mt-1 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[14px] text-[var(--color-text-secondary)]"/>{extra}</label>;
 // 步骤1→2：模拟 Agent 联网注册（随机抽取 mock 机器；自检逐项回报）
 const connectAgent=()=>{
  const m=AGENT_MOCKS[Math.floor(Math.random()*AGENT_MOCKS.length)];
  setRep(m); setConn("connecting"); setChk([false,false,false,false]);
  later(setTimeout(()=>setConn("online"),1500));
  [0,1,2,3].forEach(i=>later(setTimeout(()=>setChk(a=>a.map((v,j)=>j===i?true:v)),1900+i*450)));
 };
 // 步骤3：平台实测（阻塞式——实测通过才解锁定价发布；真实系统为异步状态机 registered→benchmarking→listed）
 const runBench=()=>{
  setBench("running"); setPct(0);
  const t0=Date.now();
  later(setInterval(()=>{ const p=Math.min(100,Math.round((Date.now()-t0)/30)); setPct(p); if(p>=100) setBench("passed"); },80));
 };
 // 发布：硬件字段=Agent 上报（唯一事实源）；实测值入 payload → 卡片 DLPerf 显示实测值；可靠性仍待首单积累（实测≠履约）
 const publish=()=>{
  act.listMachine({id:rid("m-"),name:f.name.trim(),spec:`${rep.gpuName} ×${rep.numGpu}`,numGpu:rep.numGpu,gpuRam:rep.gpuRam,memBw:rep.memBw,pcie:rep.pcie,arch:rep.arch,nvlink:!!rep.nvlink,
   cpuCores:rep.cpuCores,ram:rep.ram,netUp:rep.netUp,netDown:rep.netDown,geoloc:rep.geoloc,
   dph:+f.gpuPrice,net:+f.netPrice,sto:+f.stoPrice,endDate:f.endDate,status:"listed",contracts:0,
   realnameVerified:true,deposit:+f.deposit||0,verified:true,dlperf:rep.dlperf,
   dlperfPerUsd:Math.max(1,Math.round(rep.dlperf/+f.gpuPrice)),tflops:rep.tflops,cuda:rep.cuda});
  act.toast(T.wzOk);
 };
 const canSubmit=f.name.trim().length>0&&+f.gpuPrice>0&&S.hostRealname;
 const RO=(k,v)=><div className="flex items-baseline justify-between gap-2 border-b border-[var(--color-border)]/40 py-1">
   <span className="text-[12px] text-[var(--color-text-muted)]">{k}</span><span className="mono text-[13px] font-medium text-[var(--color-text-secondary)]">{v}</span></div>;
 return (
 <ModalShell width="max-w-xl" onClose={()=>setS(p=>({...p,modal:null}))}>
   <div className="border-b border-[var(--color-border)] px-5 py-3">
    <div className="flex items-center justify-between">
     <h2 className="text-[16px] font-semibold">{T.wzTitle}</h2>
    </div>
    <div className="mt-2 flex gap-1">{[T.wzStep1,T.wzStep2,T.wzStep3].map((s,i)=>(
     <div key={i} className={`flex-1 rounded px-2 py-1 text-center text-[12.5px] ${i<=step?"bg-[var(--color-accent)]/15 text-[var(--color-accent-hover)]":"bg-[var(--color-bg)] text-[var(--color-text-faint)]"}`}>{i+1}. {s}</div>))}
    </div>
   </div>
   <div className="min-h-[240px] space-y-3 p-5">
  {step===0 && (
      <>
       <p className="text-[14px] leading-relaxed text-[var(--color-text-muted)]">{T.wzS1Lead}</p>
       <pre className="mono overflow-x-auto rounded-lg border border-[var(--color-border)] bg-[var(--color-bg)] p-3 text-[13px] leading-relaxed text-[var(--color-success)]">curl -o nexus-agent.sh https://download.nexus-compute.example/agent/install.sh
sudo bash nexus-agent.sh --token {token}</pre>
       <p className="text-[12.5px] leading-snug text-[var(--color-text-muted)]">{T.wzS1Note}</p>
      </>
     )}
    {step===1 && (
     <>
      <div className={`flex items-center gap-2 text-[14px] ${conn==="online"?"text-[var(--color-success)]":"text-[var(--color-text-muted)]"}`}>
       <span className={`inline-block h-2 w-2 rounded-full ${conn==="online"?"bg-[var(--color-success)]":"animate-pulse bg-[var(--color-warning)]"}`}/>
       {conn==="online"?T.wzOnline:T.wzConnecting}
      </div>
      {rep && conn==="online" && (<>
       <div className="rounded-lg border border-[var(--color-border)] p-3">
        <div className="mb-1 text-[13px] font-semibold">{T.wzRepTitle}</div>
        {RO(T.wzFGpu,rep.gpuName)}
        {RO(T.wzFNum,`×${rep.numGpu}`)}
        {RO(T.wzFGpuRam,`${rep.gpuRam} GB · ${rep.memBw} GB/s`)}
        {RO(T.wzFPcie,`PCIe ${rep.pcie}`)}
        {RO(T.wzFArch,`${rep.arch}${rep.nvlink?" · NVLink":""}`)}
        {RO(T.wzFCpu,`${rep.cpuCores} cores`)}
        {RO(T.wzFRam,`${rep.ram} GB`)}
        {RO(`${T.wzFNetUp} / ${T.wzFNetDown}`,`↑${rep.netUp} ↓${rep.netDown} Mbps`)}
        {RO(T.wzFGeo,`${rep.geoloc} · IP`)}
       </div>
       <p className="text-[12px] leading-snug text-[var(--color-text-faint)]">{T.wzRepNote}</p>
       <div className="rounded-lg border border-[var(--color-border)] p-3">
        <div className="mb-1 text-[13px] font-semibold">{T.wzChkTitle}</div>
        {[T.chkDriver,T.chkToolkit,T.chkNet,T.chkPort].map((c,i)=>(
         <div key={i} className="flex items-center gap-2 py-0.5 text-[13.5px]">
          <span className={`mono w-3 text-[13px] ${chk[i]?"text-[var(--color-success)]":"text-[var(--color-text-faint)]"}`}>{chk[i]?"✓":"…"}</span>
          <span className={chk[i]?"text-[var(--color-text-secondary)]":"text-[var(--color-text-faint)]"}>{c}</span>
         </div>))}
       </div>
      </>)}
     </>
    )}
    {step===2 && (
     <div className="rounded-lg border border-[var(--color-info)]/30 bg-[var(--color-info)]/[.05] p-3">
      <p className="text-[13.5px] leading-relaxed text-[var(--color-text-muted)]">{T.wzBenchLead}</p>
      {bench==null && (
       <button onClick={runBench} className="mt-2 rounded-lg bg-[var(--color-accent)] px-4 py-1.5 text-[14px] font-semibold text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]">{T.wzBenchBtn}</button>)}
      {bench==="running" && (<>
       <div className="mt-3 h-2 overflow-hidden rounded-full bg-[var(--color-bg)]">
        <div className="h-2 rounded-full bg-[var(--color-accent)] transition-[width] duration-75" style={{width:pct+"%"}}/>
       </div>
       <p className="mt-1.5 text-[12.5px] text-[var(--color-text-muted)]">{T.wzBenchRun} <span className="mono">{pct}%</span></p>
      </>)}
      {bench==="passed" && (<>
       <p className="mt-2 flex items-center gap-1.5 text-[14px] font-semibold text-[var(--color-success)]"><span>✓</span>{T.wzBenchPass}</p>
       <p className="mono mt-1 text-[13px] text-[var(--color-text-secondary)]">DLPerf {rep.dlperf} · {Number(rep.tflops).toFixed(1)} TFLOPS · CUDA {rep.cuda}</p>
       <p className="mt-3 border-t border-[var(--color-border)]/40 pt-2 text-[13.5px] text-[var(--color-text-muted)]">{T.wzPriceLead}</p>
       <div className="mt-2 space-y-3">
        <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
         {F("name",T.wzFName,"text")}
        </div>
        <div className="grid grid-cols-1 gap-3 sm:grid-cols-3">
         {F("gpuPrice",T.wzFGpuPrice,undefined,"0.01")}{F("netPrice",T.wzFNet,undefined,"0.001")}{F("stoPrice",T.wzFSto,undefined,"0.01")}
        </div>
        <div className="grid grid-cols-1 gap-3 sm:grid-cols-2">
         {F("deposit",T.wzDeposit,undefined,"0",<span className="mt-1 block text-[12px] text-[var(--color-text-faint)]">{T.wzDepositNote}</span>)}
         <label className="block text-[13px] text-[var(--color-text-muted)]">{T.wzFEnd}
          <input type="date" value={f.endDate} onChange={e=>setF(o=>({...o,endDate:e.target.value}))} aria-label={T.wzFEndAria}
           className="mono mt-1 w-full rounded-md border border-[var(--color-border)] bg-[var(--color-bg)] px-2 py-1 text-[14px] text-[var(--color-text-secondary)]"/></label>
        </div>
        {/* 实名=账号级 KYC 一次（宿主主体）：已认证直接显示，未认证勾选即生效 */}
        {S.hostRealname ? (
         <p className="flex items-center gap-2 rounded-lg border border-[var(--color-success)]/30 bg-[var(--color-success)]/[.06] px-3 py-2 text-[13.5px] text-[var(--color-success)]"><span>✓</span>{T.wzRealname}</p>
        ) : (<>
         <label className="flex cursor-pointer items-center gap-2 rounded-lg border border-[var(--color-warning)]/25 bg-[var(--color-warning)]/[.05] px-3 py-2 text-[14px] text-[var(--color-text-secondary)] hover:border-[var(--color-warning)]/50">
          <input type="checkbox" checked={!!S.hostRealname} onChange={e=>act.setHostRealname(e.target.checked)} aria-label={T.wzRealname} className="accent-blue-500"/>{T.wzRealname}</label>
         <p className="rounded-lg border border-[var(--color-error)]/20 bg-[var(--color-error)]/[.04] p-2 text-[12.5px] leading-snug text-[var(--color-text-muted)]">{T.wzRealnameOnly}</p>
        </>)}
        <p className="rounded-lg border border-[var(--color-warning)]/25 bg-[var(--color-warning)]/[.06] p-2 text-[12.5px] leading-snug text-amber-200/90">{T.wzS2Warn}</p>
       </div>
      </>)}
     </div>
    )}
   </div>
   <div className="flex items-center justify-between border-t border-[var(--color-border)] px-5 py-3">
    <button onClick={()=>setS(p=>({...p,modal:null}))} className="rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-[14px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)]">{T.wzCancel}</button>
    <div className="flex gap-2">
     {step>0 && <button disabled={step===1&&!allChk} onClick={()=>setStep(s=>s-1)} className="rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-[14px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)] disabled:cursor-not-allowed disabled:opacity-40">{T.wzPrev}</button>}
     {step===0 && <button onClick={()=>{connectAgent();setStep(1);}} className="rounded-lg bg-[var(--color-accent)] px-4 py-1.5 text-[14px] font-semibold text-[var(--color-text)] hover:bg-[var(--color-accent-strong)]">{T.wzBtnWait}</button>}
