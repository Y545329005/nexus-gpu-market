/* ================= 派生数据 ================= */
function derive(store, accounts, cfg){
  const st = { escrow:0, hostEarnings:0, balance:0, ...(store||{}) }; // 注入最小对象时缺失字段按 0 兜底（用户端加载同口径补默认值）
  const instances = Array.isArray(st.instances)? st.instances : [];
  const ledger = Array.isArray(st.ledger)? st.ledger : [];
  const machines = Array.isArray(st.hostMachines)? st.hostMachines : [];
  // 在架供给（对齐对客端 allSupply 口径：12 静态 + 非离线宿主机，再扣 Admin 下架）
  const delisted=(cfg.delisted||[]).map(String);
  const supply=[ ...OFFERS_SUMMARY.map(o=>({id:o.id, source:"offer"})),
    ...machines.filter(m=>!["offline","removed","maintenance"].includes(m.status)).map(m=>({id:"host-"+m.id, source:m.seed?"seed":"host"})) ];
  const supplyLive = supply.filter(o=>!delisted.includes(String(o.id))).length;
  const active = instances.filter(i=>ACTIVE_STATES.includes(i.status));
  // 租客消费总额：仅计真实消费键（排除充值/退款/订单预付划款，避免口径虚高）
  const CONSUME=new Set(["lgGpu","lgStoreStop","lgBw","lgAmort"]);
  const spend = ledger.filter(e=>CONSUME.has(e.msgKey)).reduce((a,e)=>a+(e.amt||0),0);
  const hostGross = ledger.filter(e=>e.hostEarn&&e.amt>0);
  const hostNet = hostGross.reduce((a,e)=>a+e.amt*(1-(e.rate||0)),0);
  const platRev = hostGross.reduce((a,e)=>a+e.amt*(e.rate||0),0);
  const posRate = hostGross.filter(e=>(e.rate||0)>0).length, zeroRate = hostGross.length-posRate;
  const reconDiff = Math.abs(hostGross.reduce((a,e)=>a+e.amt,0) - (hostNet+platRev));
  // 审核队列：非 seed、listed、未被 Admin 通过过
  const approved=(cfg.approved||[]);
  const queue = machines.filter(m=>!m.seed && m.status==="listed" && !approved.includes(m.id));
  const emails = Object.keys(accounts||{});
  const payoutReqs = Array.isArray(st.payoutReqs)? st.payoutReqs : []; // 出金申请（用户端落盘，本端只读）
  return { st, instances, ledger, machines, supplyLive, active, spend, hostGross, hostNet, platRev, posRate, zeroRate, reconDiff, queue, emails, delisted, payoutReqs };
}

        <thead><tr><Th>{T.uEmail}</Th><Th>{T.uProvider}</Th><Th>{T.uRegAt}</Th><Th>{T.uRole}</Th><Th>{T.colAct}</Th></tr></thead>
        <tbody>{d.emails.length===0? <tr><Td cls="text-[var(--color-text-faint)]">{T.dNone}</Td></tr> : d.emails.map(e=>{
          const isBanned=banned.includes(e);
          return (<tr key={e}>
            <Td cls="mono">{e}</Td><Td>{accounts[e]?.provider||"email"}</Td><Td cls="mono text-[var(--color-text-faint)]">{fmtDate(accounts[e]?.createdAt)}</Td>
            <Td>{isBanned? <span className="text-[var(--color-error)]">{T.uBanned}</span> : (e===cur? <span className="text-[var(--color-accent-hover)]">{T.uCurrent}</span> : T.uNormal)}</Td>
            <Td>{isBanned? <Btn tone="ok" onClick={()=>act.unban(e)}>{T.uUnban}</Btn> : <Btn tone="danger" onClick={()=>act.ban(e)}>{T.uBan}</Btn>}</Td>
          </tr>);})}
        </tbody>
      </table>
      </div>
    </div>
    <div className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6">
     <div className="text-[14px] font-semibold">{T.kycTitle}</div>
        <div className="table-scroll mt-3">
        <table className="w-full text-[14px]">
          <caption className="sr-only">{T.kycTitle}</caption>
          <thead><tr><Th>{T.uEmail}</Th><Th>{T.uRegAt}</Th><Th>{T.euVer}</Th><Th>{T.euChecks}</Th><Th>{T.euVia}</Th></tr></thead>
          <tbody>{(()=>{
            const tr=d.st.endUseTrail;
            if(tr) return (
              <tr key="trail">
                <Td cls="mono">{tr.email||cur||"—"}</Td>
                <Td cls="mono text-[var(--color-text-faint)]">{fmtDate(tr.t)}</Td>
                <Td cls="mono">{tr.v||"—"}</Td>
                <Td cls="mono">{Array.isArray(tr.checks)? tr.checks.map(b=>b?"✓":"✗").join(" ") : <span className="text-[var(--color-text-muted)]">{T.euOauthNote}</span>}</Td>
                <Td cls="mono">{tr.via||"—"}</Td>
              </tr>);
            if(cur) return (<tr key="legacy"><Td cls="mono text-[var(--color-text-faint)]" >{cur}</Td><Td colSpan={4} cls="text-[var(--color-text-faint)]">{T.euNoTrail}</Td></tr>);
            return (<tr key="none"><Td colSpan={5} cls="text-[var(--color-text-faint)]">{T.euNever}</Td></tr>);
          })()}</tbody>
        </table>
        </div>
        <p className="mt-3 text-[13px] leading-relaxed text-[var(--color-text-muted)]">{T.kycBody}</p>
        <div className="mono mt-2 text-[12.5px] text-[var(--color-text-faint)]">accepted = {String(!!st.accepted)}{cur? ` · ${cur}`:""}</div>
      </div>
  </div>);
}

function Data({cfg,act,snapInfo}){
  const [confirming,setConfirming]=useState(false);
  return (<div className="grid gap-5 xl:grid-cols-2">
    <div className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6">
      <div className="text-[14px] font-semibold">{T.genTitle}</div>
      <p className="mt-2 text-[13px] leading-relaxed text-[var(--color-text-muted)]">{T.genBody}</p>
      <div className="mt-3 flex items-center gap-3">
        <button onClick={()=>{ if(!confirming){ setConfirming(true); setTimeout(()=>setConfirming(false),4000); } else { setConfirming(false); act.inject(); } }}
          className={`rounded-md border px-3 py-1.5 text-[13.5px] font-medium ${confirming? "border-[var(--color-error)] bg-[var(--color-error)]/10 text-[var(--color-error)]" : "border-[var(--color-success)]/50 text-[var(--color-success)] hover:bg-[var(--color-success)]/10"}`}>
          {confirming? (_LANG==="zh"? "再点一次确认注入" : "Click again to confirm") : T.genBtn}
        </button>
        <span className="text-[12.5px] text-[var(--color-text-faint)]">{snapInfo.has? "✓ "+T.genSnap : T.genNoSnap}</span>
      </div>
    </div>
    <div className="rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)] p-6">
      <div className="text-[14px] font-semibold">{T.genRestore}</div>
      <p className="mt-2 text-[13px] leading-relaxed text-[var(--color-text-muted)]">{T.genRestoreTip}</p>
      <div className="mt-3"><Btn tone="danger" disabled={!snapInfo.has} onClick={act.restore}>{T.genRestore}</Btn></div>
      <div className="mt-6 border-t border-[var(--color-border)] pt-5">
        <div className="text-[14px] font-semibold">{T.resetTitle}</div>
        <p className="mt-2 text-[13px] leading-relaxed text-[var(--color-text-muted)]">{T.resetBody}</p>
        <div className="mt-3"><Btn tone="danger" onClick={act.resetCfg}>{T.resetBtn}</Btn></div>
      </div>
    </div>
  </div>);
}

function Audit({cfg,act}){
  const rows=cfg.audit||[];
  return (<div className="overflow-hidden rounded-xl border border-[var(--color-border)] bg-[var(--color-surface)]">
    <div className="table-scroll">
    <table className="w-full text-[14px]">
      <caption className="sr-only">{T.aTitle}</caption>
      <thead><tr><Th w="w-36">{T.aTime}</Th><Th w="w-40">{T.aAction}</Th><Th>{T.aDetail}</Th></tr></thead>
      <tbody>{rows.length===0? <tr><Td cls="text-[var(--color-text-faint)]">{T.aEmpty}</Td></tr> : rows.map((a,i)=>(
        <tr key={i}><Td cls="mono text-[var(--color-text-faint)]">{fmtDate(a.t)}</Td><Td>{a.action}</Td><Td cls="mono text-[var(--color-text-muted)]">{a.detail||""}</Td></tr>))}
      </tbody>
    </table>
    </div>
  </div>);
}

/* ================= App ================= */
let accounts={}; // 轮询刷新的账号库快照（Users 表读取）
function App(){
  const [lang,setLangState]=useState(()=>{ try{ const l=localStorage.getItem("vast-demo-lang"); return (l==="en"||l==="zh")?l:"zh"; }catch(e){ return "zh"; } });
  setLang(lang);
  const [tab,setTab]=useState("dash");
  const [store,setStore]=useState(loadStore);
  const [cfg,setCfg]=useState(()=>({...defaultCfg(),...loadAdminCfg()}));
  const [syncAt,setSyncAt]=useState(nowStr());
  const [tickN,setTickN]=useState(0); // 强制轮询重渲染
  const [mobileNav,setMobileNav]=useState(false); // P1-R1: 移动端侧栏开关
  const [notice,setNotice]=useState(null);        // P3-P3: 内联操作反馈（非模态、非全屏）
  const noticeTimer=useRef(null);
  const flash=(m)=>{ setNotice(m); if(noticeTimer.current) clearTimeout(noticeTimer.current); noticeTimer.current=setTimeout(()=>setNotice(null),2600); };
  // 轮询用户端两键（对客端 dumpState 每 1s 落盘；本端 0.5s 读取——演示"后台看得见"）
  useEffect(()=>{
    const iv=setInterval(()=>{ setStore(loadStore()); accounts=loadAccounts(); setSyncAt(nowStr()); setTickN(n=>n+1); },500);
    const onStorage=e=>{ if(e.key===STORE_KEY||e.key===ACCOUNTS_KEY){ setStore(loadStore()); accounts=loadAccounts(); setSyncAt(nowStr()); } };
    window.addEventListener("storage",onStorage);
    return ()=>{ clearInterval(iv); window.removeEventListener("storage",onStorage); };
  },[]);
  const d=useMemo(()=>derive(store,accounts,cfg),[store,cfg,tickN]);
  const snapInfo={has:!!cfg.backup};
  const act={
    delistOffer:(id)=>{ setCfg(c=>commitCfg({...c,delisted:[...new Set([...(c.delisted||[]),String(id)])]},T.aDelist,id)); flash(T.aDelist+" · "+id); },
    restoreOffer:(id)=>{ setCfg(c=>commitCfg({...c,delisted:(c.delisted||[]).filter(x=>x!==String(id))},T.aRestore,id)); flash(T.aRestore+" · "+id); },
    approve:(id)=>{ setCfg(c=>commitCfg({...c,approved:[...(c.approved||[]),id]},T.aApprove,id)); flash(T.aApprove+" · "+id); },
    reject:(id)=>{ setCfg(c=>commitCfg({...c,approved:(c.approved||[]).filter(x=>x!==id),delisted:[...new Set([...(c.delisted||[]),"host-"+id])]},T.aReject,id)); flash(T.aReject+" · "+id); },
    forceStop:(key)=>{ send({type:"forceStop",key}); setCfg(c=>commitCfg({...c,forceStops:[...new Set([...(c.forceStops||[]),key])]},T.aStop,key)); flash(T.aStop+" · "+key); },
    forceDestroy:(key)=>{ send({type:"forceDestroy",key}); setCfg(c=>commitCfg(c,T.aDestroy,key)); flash(T.aDestroy+" · "+key); },
    setCommission:(pct)=>{ setCfg(c=>commitCfg({...c,commission:pct/100},T.aComm,pct+"%")); flash(T.fApplied(pct)); },
    setTransFee:(on)=>{ setCfg(c=>commitCfg({...c,transitionStorageFee:on},T.aTransFee,on?"on":"off")); flash(T.fTransFeeApplied(on)); },
    payoutOk:(q)=>{ setCfg(c=>{ const po=c.payouts||{approved:[],rejected:[]};
      if(po.approved.some(x=>x.id===q.id)) return c; // 幂等：重复点击不重复入账本
      return commitCfg({...c,payouts:{approved:[...po.approved,{id:q.id,email:q.email,channel:q.channel,amt:q.amt,t:q.t,at:Date.now()}],rejected:po.rejected}},T.aPayoutOk,q.email+" · $"+q.amt); });
      flash(T.aPayoutOk+" · "+q.email+" $"+q.amt); },
    payoutNo:(q)=>{ setCfg(c=>{ const po=c.payouts||{approved:[],rejected:[]};
      if(po.rejected.some(x=>x.id===q.id)) return c;
      return commitCfg({...c,payouts:{approved:po.approved,rejected:[...po.rejected,{id:q.id,email:q.email,amt:q.amt,t:q.t,at:Date.now()}]}},T.aPayoutNo,q.email+" · $"+q.amt); });
      flash(T.aPayoutNo+" · "+q.email); },
    ban:(e)=>{ setCfg(c=>commitCfg({...c,banned:[...new Set([...(c.banned||[]),e])]},T.aBan,e)); flash(T.uBanTip(e)); },
    unban:(e)=>{ setCfg(c=>commitCfg({...c,banned:(c.banned||[]).filter(x=>x!==e)},T.aUnban,e)); flash(T.uUnbanTip(e)); },
    inject:()=>{
      const snap={store:loadStore(), accounts:loadAccounts(), at:Date.now()};
      // 在线探测：150ms 内收到用户端 pong → 其自行注入（写权分离）；离线 → 本端读-改-写合并直写（单开 Admin 也能演示）
      const pid="p"+Date.now(); let online=false;
      const onPong=(ev)=>{ if(ev.data&&ev.data.type==="pong"&&ev.data.id===pid) online=true; };
      try{ _BC.addEventListener("message",onPong); }catch(e){}
      send({type:"ping",id:pid});
      setTimeout(()=>{
        try{ _BC.removeEventListener("message",onPong); }catch(e){}
        if(!online){ // 离线直写：与用户端 inject 处理器同一合并口径
          const s=loadStore()||{};
          const merged={...s,
            balance:+(((s.balance)||0)+GEN_PAYLOAD.balance).toFixed(2),
            hostMachines:[...GEN_PAYLOAD.hostMachines,...(Array.isArray(s.hostMachines)?s.hostMachines:[])],
            ledger:trimLedger([...GEN_PAYLOAD.ledger,...(Array.isArray(s.ledger)?s.ledger:[])])};
          try{ localStorage.setItem(STORE_KEY,JSON.stringify(merged)); }catch(e){}
          const a=loadAccounts(); GEN_PAYLOAD.accounts.forEach(x=>{ if(!a[x.email]) a[x.email]={pwd:x.pwd,provider:"email",createdAt:Date.now()}; });
          try{ localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(a)); }catch(e){}
          setStore(loadStore()); accounts=loadAccounts();
        }else{ send({type:"inject",payload:GEN_PAYLOAD}); }
        flash(T.genDone);
        setCfg(c=>commitCfg({...c,backup:snap},T.aGen,(online?"client":"offline-direct")+" · "+GEN_PAYLOAD.hostMachines[0].id));
      },150);
    },
    restore:()=>{ const b=cfg.backup; if(!b) return;
      // P3-P3: 返回值/写盘结果检查——失败不入"成功"口径
      let ok=true;
      try{ if(b.store){ localStorage.setItem(STORE_KEY,JSON.stringify(b.store)); } }catch(e){ ok=false; }
      try{ if(b.accounts){ localStorage.setItem(ACCOUNTS_KEY,JSON.stringify(b.accounts)); } }catch(e){ ok=false; }
      send({type:"cfg"}); send({type:"reload"});
      setStore(loadStore()); accounts=loadAccounts();
      setCfg(c=>commitCfg(c,T.aSnapRestore,(ok?"ok":"write-failed")+" · "+(b.store?"store":"")+(b.accounts?" accounts":"")));
      flash(ok? T.genRestored : (_LANG==="zh"?"快照还原写入失败":"snapshot restore write failed"));
    },
    resetCfg:()=>{ const fresh=defaultCfg(); saveAdminCfg(fresh); send({type:"cfg"}); setCfg(fresh); flash(T.resetDone); },
  };
  const nav=[["dash",T.navDash],["market",T.navMarket],["inst",T.navInst],["fund",T.navFund],["user",T.navUser],["data",T.navData],["audit",T.navAudit]];
  const toggleLang=()=>{ const nl=lang==="zh"?"en":"zh"; try{localStorage.setItem("vast-demo-lang",nl)}catch(e){}; setLangState(nl); };
  return (<div className="flex min-h-screen">
    {/* P1-R1: 移动端 backdrop */}
    {mobileNav && <div className="sidebar-backdrop fixed inset-0 z-30 hidden bg-black/40 max-md:block" onClick={()=>setMobileNav(false)} aria-hidden="true"/>}
    {/* 侧栏 */}
    <aside id="admin-sidebar" data-open={mobileNav} className={`sidebar-responsive flex w-64 shrink-0 flex-col border-r border-[var(--color-border)] bg-[var(--color-surface)] max-md:fixed max-md:inset-y-0 max-md:left-0 max-md:z-40 max-md:-translate-x-full md:static`}>
      <div className="border-b border-[var(--color-border)] px-5 py-4">
        <div className="text-[17px] font-bold tracking-tight">Nexus<span className="text-[var(--color-accent-hover)]">·</span>Admin</div>
        <span className="mt-1 inline-block rounded border border-[var(--color-border)] px-1 py-px text-[11.5px] uppercase tracking-wider text-[var(--color-text-muted)]">{T.appDemo}</span>
      </div>
      <nav className="flex-1 space-y-1 p-3">
        {nav.map(([k,l])=>(
          <button key={k} onClick={()=>{setTab(k); setMobileNav(false);}}
            className={`btn-touch w-full rounded-lg px-3 py-2 text-left text-[14px] ${tab===k?"bg-[var(--color-accent)]/10 font-semibold text-[var(--color-accent-hover)]":"text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]"}`}
            aria-current={tab===k?"page":undefined}>{l}</button>))}
      </nav>
      <div className="space-y-2 border-t border-[var(--color-border)] p-4">
        <a href="/index.html" className="btn-touch block rounded-lg border border-[var(--color-border)] px-3 py-2 text-center text-[13px] text-[var(--color-text-secondary)] hover:border-[var(--color-border-strong)]">{T.openClient}</a>
        <button onClick={toggleLang} aria-label={lang==="zh"?"Switch to English":"切换到中文"} className="btn-touch w-full rounded-lg border border-[var(--color-border)] px-3 py-1.5 text-[13px] text-[var(--color-text-muted)] hover:border-[var(--color-border-strong)]">{lang==="zh"?"EN":"中文"}</button>
        <p className="text-[12.5px] leading-snug text-[var(--color-text-faint)]">{T.sidenavHint}</p>
      </div>
    </aside>
    {/* 主区 */}
    <main className="min-w-0 flex-1 p-5 md:p-8">
      <header className="mb-6 flex flex-wrap items-center justify-between gap-y-2">
        <div className="flex items-center gap-2">
          <button onClick={()=>setMobileNav(v=>!v)} className="hidden max-md:flex rounded-lg border border-[var(--color-border)] p-2 text-[var(--color-text-secondary)] hover:bg-[var(--color-surface-alt)]" aria-label="Toggle navigation" aria-expanded={mobileNav} aria-controls="admin-sidebar">
            <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" strokeWidth="1.5"><path d="M3 5h14M3 10h14M3 15h14"/></svg>
          </button>
          <h1 className="text-[21px] font-bold tracking-tight">{nav.find(n=>n[0]===tab)?.[1]}</h1>
        </div>
        <span className="flex items-center gap-1.5 text-[13px] text-[var(--color-text-faint)]" title={T.syncHint}>
          <span className="dot-pulse inline-block h-1.5 w-1.5 rounded-full bg-[var(--color-success)] motion-reduce:animate-none"></span>{T.dLive} · {syncAt}
        </span>
        {notice && <span className="rounded border border-[var(--color-success)]/40 bg-[var(--color-success)]/5 px-2.5 py-1 text-[13px] text-[var(--color-success)]" aria-live="polite">{notice}</span>}
      </header>
      {tab==="dash" && <Dashboard d={d} syncAt={syncAt}/>}
      {tab==="market" && <Market d={d} act={act}/>}
      {tab==="inst" && <Instances d={d} act={act}/>}
      {tab==="fund" && <Fund d={d} cfg={cfg} act={act}/>}
      {tab==="user" && <Users d={d} cfg={cfg} act={act}/>}
      {tab==="data" && <Data cfg={cfg} act={act} snapInfo={snapInfo}/>}
      {tab==="audit" && <Audit cfg={cfg} act={act}/>}
    </main>
  </div>);
}
ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
